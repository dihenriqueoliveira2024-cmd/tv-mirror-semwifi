              @Override protected void onResume(){super.onResume();ui.post(ticker);}
              @Override protected void onPause(){super.onPause();ui.removeCallbacks(ticker);if(blink!=null){blink.cancel();blink=null;}lastState=-1;}
              private void toggle(){
                  if(MirrorService.running){stopService(new Intent(this,MirrorService.class));ui.postDelayed(new Runnable(){@Override public void run(){refresh();}},500);}
                  else{MediaProjectionManager m=(MediaProjectionManager)getSystemService(Context.MEDIA_PROJECTION_SERVICE);startActivityForResult(m.createScreenCaptureIntent(),REQ_CAPTURE);}
              }
              @Override protected void onActivityResult(int requestCode,int resultCode,Intent data){
                  super.onActivityResult(requestCode,resultCode,data);
                  if(requestCode==REQ_CAPTURE&&resultCode==RESULT_OK&&data!=null){Intent i=new Intent(this,MirrorService.class);i.putExtra("code",resultCode);i.putExtra("data",data);putSettings(i);if(Build.VERSION.SDK_INT>=26)startForegroundService(i);else startService(i);ui.postDelayed(new Runnable(){@Override public void run(){refresh();}},800);}
              }
              private void putSettings(Intent i){i.putExtra("edge",RES_V[sel[0]]);i.putExtra("fps",FPS_V[sel[1]]);i.putExtra("quality",QUAL_V[sel[2]]);i.putExtra("audio",sel[3]==0);i.putExtra("rate",RATE_V[sel[4]]);i.putExtra("ch",sel[5]==1?1:2);}
              private void pushLive(){if(!MirrorService.running)return;Intent i=new Intent(this,MirrorService.class);i.setAction(MirrorService.ACTION_UPDATE);putSettings(i);startService(i);}
              private void sendToTv(){
                  if(!MirrorService.running){tvStatus.setVisibility(View.VISIBLE);tvStatus.setText("Inicie o espelhamento primeiro.");return;}
                  tvStatus.setVisibility(View.VISIBLE);tvStatus.setText("Procurando a TV na rede… aceite o aviso na TV, se aparecer.");
                  final List<String> ips=localIps();
                  new Thread(new Runnable(){@Override public void run(){final String result=TvLauncher.openUrl(ips,MirrorService.PORT,prefs);runOnUiThread(new Runnable(){@Override public void run(){tvStatus.setText(result);}});}}).start();
              }

              private void refresh(){
                  if(statusPill==null)return;
                  boolean on=MirrorService.running; boolean connected=MirrorServer.viewerActive();
                  updateStatus(on, connected);
                  mainBtnText.setText(on?"DESCONECTAR":"CONECTAR"); mainBtn.setBackground(rounded(on?DANGER:ACCENT,26));
                  {
                      List<String> ips=localIps();StringBuilder b=new StringBuilder();
                      for(String ip:ips){if(b.length()>0)b.append("\n");b.append(ip).append(":").append(MirrorService.PORT);}
                      urlText.setText(b.length()==0?(on?"IP não detectado":"Ligue o hotspot"):b.toString());
                      hintText.setText(!on?"Ligue o hotspot, conecte a TV nele e toque em Conectar.":(connected?"TV recebendo a imagem.":"Digite o endereço acima no navegador da TV."));
                      if(on){tvBtn.setVisibility(View.VISIBLE);}else{tvBtn.setVisibility(View.GONE);tvStatus.setVisibility(View.GONE);tvStatus.setText("");}
                  }
                  long now=System.currentTimeMillis();long total=MirrorServer.bytesSent;long delta=Math.max(0,total-lastBytes);long elapsed=lastSample==0?1000:Math.max(1,now-lastSample);networkKbps=(delta*1000f/elapsed)/1024f;lastBytes=total;lastSample=now;
                  int fps=on?MirrorService.currentFps:0;int rtt=MirrorServer.tvRttMs;
                  if(fpsValue!=null){fpsValue.setText(on?fps+" FPS":"—");netValue.setText(on?String.format(java.util.Locale.US,"%.1f KB/s",networkKbps):"—");latencyValue.setText(on&&connected?(rtt>=0?rtt+" ms":"Aguardando medição") : "—");monitorState.setText(!on?"Espelhamento parado":(connected?"TV recebendo imagem":"Servidor ativo • aguardando TV"));monitorState.setTextColor(connected?GREEN:AMBER);
                      fpsGraph.add(fps);netGraph.add(networkKbps);latencyGraph.add(rtt<0?0:rtt);
                  }
                  for(int i=0;i<3;i++){boolean m=sel[0]==PRESET_V[i][0]&&sel[1]==PRESET_V[i][1]&&sel[2]==PRESET_V[i][2];presetChips[i].setBackground(rounded(m?ACCENT:CHIP,12));presetChips[i].setTextColor(m?ON_ACCENT:MUTED);}
                  for(int k=0;k<6;k++)for(int i=0;i<chips[k].length;i++){boolean selected=i==sel[k];chips[k][i].setBackground(rounded(selected?ACCENT:CHIP,12));chips[k][i].setTextColor(selected?ON_ACCENT:MUTED);}
                  if(audioText!=null){String a=Build.VERSION.SDK_INT<29?"Áudio indisponível neste Android (precisa do Android 10 ou superior).":(on?(MirrorService.audioActive?"Áudio: ativo":"Áudio: desligado ou sem permissão") : "Áudio disponível no Android 10 ou superior.");audioText.setText(a);}
              }
              private static List<String> localIps(){
                  List<String> r=new ArrayList<String>();try{for(NetworkInterface ni:Collections.list(NetworkInterface.getNetworkInterfaces())){if(!ni.isUp()||ni.isLoopback())continue;String n=ni.getName();if(n.startsWith("rmnet")||n.startsWith("ccmni")||n.startsWith("dummy")||n.startsWith("tun")||n.startsWith("v4-"))continue;for(InetAddress a:Collections.list(ni.getInetAddresses()))if(a instanceof Inet4Address&&!a.isLoopbackAddress()){if(n.startsWith("ap")||n.startsWith("swlan")||n.startsWith("softap")||n.equals("wlan1"))r.add(0,a.getHostAddress());else r.add(a.getHostAddress());}}}catch(Exception ignored){}return r;
              }

              private class GraphView extends View{
                  private final Paint paint=new Paint(3);private final ArrayList<Float> values=new ArrayList<Float>();
                  GraphView(Context c){super(c);setLayerType(View.LAYER_TYPE_SOFTWARE,null);}
                  void add(float v){values.add(v);while(values.size()>30)values.remove(0);invalidate();}
                  @Override protected void onDraw(Canvas c){super.onDraw(c);float w=getWidth(),h=getHeight();paint.setColor(GRAPH_GRID);paint.setStrokeWidth(dp(1));for(int i=1;i<4;i++)c.drawLine(0,h*i/4,w,h*i/4,paint);if(values.size()<2)return;float max=1;for(float v:values)max=Math.max(max,v);paint.setColor(ACCENT);paint.setStrokeWidth(dp(2));paint.setStyle(Paint.Style.STROKE);Path path=new Path();for(int i=0;i<values.size();i++){float x=w*i/(Math.max(1,values.size()-1));float y=h-dp(5)-(values.get(i)/max)*(h-dp(10));if(i==0)path.moveTo(x,y);else path.lineTo(x,y);}c.drawPath(path,paint);paint.setStyle(Paint.Style.FILL);}
              }
          }
          EOF


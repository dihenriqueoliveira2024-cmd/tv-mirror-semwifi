                          server.push(baos.toByteArray());
                          long now = System.currentTimeMillis();
                          fpsWindowFrames++;
                          if (fpsWindowStart == 0) fpsWindowStart = now;
                          if (now - fpsWindowStart >= 1000) {
                              currentFps = (int)Math.round(fpsWindowFrames * 1000.0 / Math.max(1, now - fpsWindowStart));
                              fpsWindowFrames = 0;
                              fpsWindowStart = now;
                          }
                      }
                  } catch (Exception e) {
                      // ignora frame com erro
                  } finally {
                      if (img != null) img.close();
                  }
              }

              private Notification buildNotification() {
                  Intent open = new Intent(this, MainActivity.class);
                  int piFlags = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, piFlags);
                  Intent stop = new Intent(this, MirrorService.class);
                  stop.setAction(ACTION_STOP);
                  PendingIntent stopPi = PendingIntent.getService(this, 1, stop, piFlags);
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      nm.createNotificationChannel(new NotificationChannel(CHANNEL, "Espelhamento", NotificationManager.IMPORTANCE_LOW));
                      b = new Notification.Builder(this, CHANNEL);
                  } else {
                      b = new Notification.Builder(this);
                  }
                  return b.setContentTitle("Espelhando a tela")
                          .setContentText("Abra o endereco no navegador da TV")
                          .setSmallIcon(android.R.drawable.ic_menu_share)
                          .setContentIntent(pi)
                          .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Parar", stopPi)
                          .setOngoing(true)
                          .build();
              }

              private void cleanup() {
                  running = false;
                  audioActive = false;
                  currentFps = 0;
                  fpsWindowFrames = 0;
                  fpsWindowStart = 0;
                  try { if (handler != null) handler.removeCallbacks(pendingTask); } catch (Exception e) { }
                  synchronized (audioLock) {
                      try { if (audio != null) audio.stop(); } catch (Exception e) { }
                      audio = null;
                  }
                  try { if (dm != null && dispListener != null) dm.unregisterDisplayListener(dispListener); } catch (Exception e) { }
                  try { if (vd != null) vd.release(); } catch (Exception e) { }
                  try { if (reader != null) reader.close(); } catch (Exception e) { }
                  try {
                      if (projection != null) {
                          if (projCallback != null) projection.unregisterCallback(projCallback);
                          projection.stop();
                      }
                  } catch (Exception e) { }
                  try { if (server != null) server.stop(); } catch (Exception e) { }
                  try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception e) { }
                  try { if (thread != null) thread.quitSafely(); } catch (Exception e) { }
                  vd = null; reader = null; projection = null; server = null;
                  wl = null; thread = null; dispListener = null; bmp = null;
              }

              @Override public void onDestroy() {
                  cleanup();
                  super.onDestroy();
              }
          }

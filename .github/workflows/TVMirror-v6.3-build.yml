              // Desconectado (vermelho) | Conectando (amarelo piscando devagar) | Conectado (verde)
              private void updateStatus(boolean on, boolean connected) {
                  int state = !on ? 0 : (connected ? 1 : 2);
                  if (state == lastState) return;
                  lastState = state;
                  if (blink != null) { blink.cancel(); blink = null; }
                  statusPill.setAlpha(1f);
                  if (state == 0) {
                      statusPill.setText("Desconectado");
                      statusPill.setTextColor(0xFFC62828);
                      statusPill.setBackground(rounded(0xFFFDE3E3, 20));
                  } else if (state == 1) {
                      statusPill.setText("Conectado");
                      statusPill.setTextColor(0xFF0B7A43);
                      statusPill.setBackground(rounded(0xFFD8F3E3, 20));
                  } else {
                      statusPill.setText("Conectando");
                      statusPill.setTextColor(0xFF8A5200);
                      statusPill.setBackground(rounded(0xFFFFEFC2, 20));
                      blink = ObjectAnimator.ofFloat(statusPill, "alpha", 1f, 0.3f);
                      blink.setDuration(1100);
                      blink.setRepeatCount(ValueAnimator.INFINITE);
                      blink.setRepeatMode(ValueAnimator.REVERSE);
                      blink.start();
                  }
              }


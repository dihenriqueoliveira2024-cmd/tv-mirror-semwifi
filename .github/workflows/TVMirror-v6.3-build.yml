              private void readSettings(Intent intent) {
                  maxEdge = Math.max(320, intent.getIntExtra("edge", 1280));
                  quality = Math.max(10, Math.min(100, intent.getIntExtra("quality", 60)));
                  int fps = Math.max(5, Math.min(120, intent.getIntExtra("fps", 30)));
                  minIntervalMs = Math.max(4, 1000 / fps - 2);
                  wantAudio = intent.getBooleanExtra("audio", true);
                  rate = intent.getIntExtra("rate", 48000);
                  ch = intent.getIntExtra("ch", 2) == 1 ? 1 : 2;

name: Build TV Mirror APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar arquivos do projeto
        run: |
          set -e
          mkdir -p tvmirror/app/src/main/java/com/tvmirror/app tvmirror/app/src/main/assets
          cd tvmirror
          mkdir -p app/src/main/res/drawable app/src/main/res/values app/src/main/res/mipmap-anydpi-v21 app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'TVMirror'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tvmirror.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.tvmirror.app'
                  minSdk 21
                  targetSdk 34
                  versionCode 63
                  versionName '6.3'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:label="TV Mirror"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MirrorService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <title>TV Mirror</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; font-family: sans-serif; }
            #c { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
            .pill { position: fixed; padding: 10px 22px; border-radius: 999px; background: rgba(20,22,28,0.85); color: #fff; font-size: 22px; }
            #msg { top: 24px; left: 24px; }
            #snd { bottom: 24px; left: 24px; color: #ffd166; }
          </style>
          </head>
          <body>
          <canvas id="c" width="16" height="9"></canvas>
          <div id="msg" class="pill">Conectando...</div>
          <div id="snd" class="pill" style="display:none">Som: aperte qualquer tecla no controle para ativar</div>

          <script>
            var cv = document.getElementById('c');
            var g = cv.getContext('2d');
            var msg = document.getElementById('msg');
            var snd = document.getElementById('snd');

            var lastSeq = -1, pendingBlob = null, decoding = false;
            var connectionErrors = 0;

            // ---------- video: a TV pede cada quadro quando esta pronta ----------
            function loop() {
              fetch('/frame?after=' + lastSeq, { cache: 'no-store' }).then(function (res) {
                var s = parseInt(res.headers.get('X-Seq'), 10);
                if (res.status === 204) {
                  if (!isNaN(s) && s < lastSeq) lastSeq = -1;
                  loop();
                  return;
                }
                return res.blob().then(function (b) {
                  lastSeq = isNaN(s) ? lastSeq + 1 : s;
                  loop();
                  pendingBlob = b;
                  kick();
                });
              }).catch(function () {
                connectionErrors++;
                msg.style.display = 'block';
                msg.textContent = 'Reconectando...';
                setTimeout(loop, 1000);
              });
            }

            function finish(ok) {
              decoding = false;
              if (ok) {
                connectionErrors = 0;
                msg.style.display = 'none';
              }
              kick();
            }

            function kick() {
              if (decoding || !pendingBlob) return;
              var b = pendingBlob;
              pendingBlob = null;
              decoding = true;
              var t0 = performance.now();
              if (window.createImageBitmap) {
                createImageBitmap(b).then(function (bm) {
                  if (cv.width !== bm.width || cv.height !== bm.height) { cv.width = bm.width; cv.height = bm.height; }
                  receivedWidth = bm.width; receivedHeight = bm.height;
                  g.drawImage(bm, 0, 0);
                  if (bm.close) bm.close();
                  finish(true);
                }).catch(function () { finish(false); });
              } else {
                var img = new Image();
                var u = URL.createObjectURL(b);
                img.onload = function () {
                  if (cv.width !== img.width || cv.height !== img.height) { cv.width = img.width; cv.height = img.height; }
                  receivedWidth = img.width; receivedHeight = img.height;
                  g.drawImage(img, 0, 0);
                  URL.revokeObjectURL(u);
                  finish(true);
                };
                img.onerror = function () { URL.revokeObjectURL(u); finish(false); };
                img.src = u;
              }
            }

            // Mede o tempo de ida e volta TV -> celular e envia a amostra ao monitor do app.
            function pingPhone() {
              var t0 = performance.now();
              fetch('/ping?ts=' + Date.now(), { cache: 'no-store' }).then(function () {
                var ms = Math.max(0, Math.round(performance.now() - t0));
                fetch('/latency?ms=' + ms, { cache: 'no-store' }).catch(function () {});
              }).catch(function () {});
            }
            setInterval(pingPhone, 2000);
            pingPhone();

            loop();

            // ---------- audio ----------
            var cfg = { audio: false, rate: 48000, ch: 2, v: 0 };
            var ctx = null, audioCtl = null, audioVer = -1;
            var nextTime = 0, delay = 0.12, leftover = null, fsDone = false;

            function updateHint() {
              var need = cfg.audio && (!ctx || ctx.state !== 'running');
              snd.textContent = 'Som: aperte qualquer tecla no controle para ativar';
              snd.style.display = need ? 'block' : 'none';
            }

            function flash(text) {
              snd.style.display = 'block';
              snd.textContent = text;
              setTimeout(updateHint, 1800);
            }

            function ensureCtx() {
              if (ctx) return true;
              var AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return false;
              try { ctx = new AC(); } catch (err) { return false; }
              ctx.onstatechange = updateHint;
              return true;
            }

            function stopAudioStream() {
              if (audioCtl) {
                try { audioCtl.abort(); } catch (err) {}
                audioCtl = null;
              }
            }

            function startAudioStream() {
              stopAudioStream();
              var ctl = window.AbortController ? new AbortController() : { abort: function () {} };
              audioCtl = ctl;
              audioVer = cfg.v;
              leftover = null;
              nextTime = 0;
              function lost() {
                if (audioCtl === ctl) { audioCtl = null; setTimeout(syncAudio, 1000); }
              }
              fetch('/audio', ctl.signal ? { signal: ctl.signal } : undefined).then(function (res) {
                var reader = res.body.getReader();
                function read() {
                  reader.read().then(function (r) {
                    if (audioCtl !== ctl) return;
                    if (r.done) { lost(); return; }
                    playChunk(r.value);
                    read();
                  }).catch(lost);
                }
                read();
              }).catch(lost);
            }

            function syncAudio() {
              if (!cfg.audio) { stopAudioStream(); updateHint(); return; }
              if (!ensureCtx()) return;
              if (ctx.state === 'suspended' && ctx.resume) {
                var p = ctx.resume();
                if (p && p.then) p.then(updateHint, function () {});
              }
              if (!audioCtl || audioVer !== cfg.v) startAudioStream();
              updateHint();
            }

            function pollCfg() {
              fetch('/config', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (c) {
                var changed = (c.v !== cfg.v) || (c.audio !== cfg.audio);
                cfg = c;
                if (changed || (cfg.audio && !audioCtl)) syncAudio();
              }).catch(function () {});
            }
            pollCfg();
            setInterval(pollCfg, 2000);

            function activate(e) {
              if (!fsDone) {
                fsDone = true;
                try {
                  var el = document.documentElement;
                  if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
                } catch (err) {}
              }
              if (cfg.audio) {
                if (!ctx) syncAudio();
                if (ctx && ctx.state === 'suspended' && ctx.resume) {
                  var p = ctx.resume();
                  if (p && p.then) p.then(updateHint, function () {});
                }
              }
              if (e && e.type === 'keydown' && ctx) {
                var c = e.keyCode, changed = false;
                if (c === 39) { delay += 0.05; changed = true; }
                if (c === 37) { delay = Math.max(0.02, delay - 0.05); changed = true; }
                if (changed) {
                  nextTime = 0;
                  flash('Atraso do som: ' + Math.round(delay * 1000) + ' ms');
                }
              }
            }
            document.addEventListener('keydown', activate);
            document.addEventListener('click', activate);

            function playChunk(chunk) {
              var chn = cfg.ch === 1 ? 1 : 2;
              var bpf = 2 * chn;
              var data = chunk;
              if (leftover) {
                var m = new Uint8Array(leftover.length + chunk.length);
                m.set(leftover, 0);
                m.set(chunk, leftover.length);
                data = m;
              }
              var frames = Math.floor(data.length / bpf);
              var used = frames * bpf;
              leftover = used < data.length ? data.slice(used) : null;
              if (frames === 0) return;
              if (!ctx || ctx.state !== 'running') return;
              var now = ctx.currentTime;
              if (nextTime < now + 0.02) nextTime = now + delay;
              else if (nextTime > now + delay + 0.4) return;
              var buf = ctx.createBuffer(chn, frames, cfg.rate);
              var L = buf.getChannelData(0);
              var R = chn === 2 ? buf.getChannelData(1) : null;
              var dv = new DataView(data.buffer, data.byteOffset, used);
              for (var i = 0; i < frames; i++) {
                L[i] = dv.getInt16(i * bpf, true) / 32768;
                if (R) R[i] = dv.getInt16(i * bpf + 2, true) / 32768;
              }
              var src = ctx.createBufferSource();
              src.buffer = buf;
              src.connect(ctx.destination);
              src.start(nextTime);
              nextTime += buf.duration;
            }
          </script>
          </body>
          </html>
          EOF

          cat > app/src/main/java/com/tvmirror/app/MirrorServer.java <<'EOF'
          package com.tvmirror.app;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.LinkedBlockingQueue;
          import java.util.concurrent.TimeUnit;

          public class MirrorServer {
              private static volatile long lastFrameReq = 0;
              static volatile long bytesSent = 0;
              static volatile int tvRttMs = -1;

              static boolean viewerActive() {
                  return System.currentTimeMillis() - lastFrameReq < 3000;
              }

              private final int port;
              private final byte[] html;
              private volatile String config = "{\"audio\":false,\"rate\":48000,\"ch\":2,\"v\":0}";
              private ServerSocket serverSocket;
              private volatile boolean running = false;
              private final Object lock = new Object();
              private byte[] frame = null;
              private long seq = 0;
              private final List<Socket> clients = new ArrayList<Socket>();
              private final List<LinkedBlockingQueue<byte[]>> audioQueues = new ArrayList<LinkedBlockingQueue<byte[]>>();

              public MirrorServer(int port, byte[] html) {
                  this.port = port;
                  this.html = html;
              }

              public void setConfig(String c) {
                  config = c;
              }

              public void start() throws Exception {
                  serverSocket = new ServerSocket();
                  serverSocket.setReuseAddress(true);
                  serverSocket.bind(new InetSocketAddress(port));
                  running = true;
                  Thread t = new Thread(new Runnable() {
                      @Override public void run() { acceptLoop(); }
                  }, "mirror-accept");
                  t.start();
              }

              private void acceptLoop() {
                  while (running) {
                      try {
                          final Socket s = serverSocket.accept();
                          synchronized (clients) { clients.add(s); }
                          Thread t = new Thread(new Runnable() {
                              @Override public void run() { handle(s); }
                          }, "mirror-client");
                          t.start();
                      } catch (Exception e) {
                          if (!running) return;
                      }
                  }
              }

              public void push(byte[] jpeg) {
                  synchronized (lock) {
                      frame = jpeg;
                      seq++;
                      lock.notifyAll();
                  }
              }

              public void pushAudio(byte[] chunk) {
                  synchronized (audioQueues) {
                      for (LinkedBlockingQueue<byte[]> q : audioQueues) {
                          while (!q.offer(chunk)) { q.poll(); }
                      }
                  }
              }

              private void handle(Socket s) {
                  try {
                      s.setTcpNoDelay(true);
                      s.setSoTimeout(30000);
                      BufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream(), "ISO-8859-1"));
                      OutputStream out = s.getOutputStream();
                      while (running) {
                          String line = in.readLine();
                          if (line == null) return;
                          String h;
                          while ((h = in.readLine()) != null && h.length() > 0) { }
                          String[] parts = line.split(" ");
                          String path = parts.length > 1 ? parts[1] : "/";
                          if (path.startsWith("/frame")) {
                              serveFrame(out, path);
                          } else if (path.startsWith("/audio")) {
                              s.setSoTimeout(0);
                              audio(s, out);
                              return;
                          } else if (path.startsWith("/ping")) {
                              byte[] b = "ok".getBytes("UTF-8");
                              String head = "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nCache-Control: no-store\r\nContent-Length: " + b.length + "\r\nConnection: keep-alive\r\n\r\n";
                              out.write(head.getBytes("ISO-8859-1")); out.write(b); out.flush();
                          } else if (path.startsWith("/latency")) {
                              int q = path.indexOf("ms=");
                              if (q >= 0) { try { tvRttMs = Math.max(0, Math.min(9999, Integer.parseInt(path.substring(q + 3).split("&")[0]))); } catch (Exception ignored) { } }
                              byte[] b = "ok".getBytes("UTF-8");
                              String head = "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nCache-Control: no-store\r\nContent-Length: " + b.length + "\r\nConnection: keep-alive\r\n\r\n";
                              out.write(head.getBytes("ISO-8859-1")); out.write(b); out.flush();
                          } else if (path.startsWith("/config")) {
                              byte[] b = config.getBytes("UTF-8");
                              String head = "HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nCache-Control: no-store\r\n"
                                      + "Content-Length: " + b.length + "\r\nConnection: keep-alive\r\n\r\n";
                              out.write(head.getBytes("ISO-8859-1"));
                              out.write(b);
                              out.flush();
                          } else if (path.equals("/") || path.startsWith("/?") || path.startsWith("/index")) {
                              String head = "HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\n"
                                      + "Cache-Control: no-cache\r\n"
                                      + "Content-Length: " + html.length + "\r\nConnection: close\r\n\r\n";
                              out.write(head.getBytes("ISO-8859-1"));
                              out.write(html);
                              out.flush();
                              return;
                          } else {
                              out.write("HTTP/1.1 404 Not Found\r\nContent-Length: 0\r\nConnection: close\r\n\r\n".getBytes("ISO-8859-1"));
                              out.flush();
                              return;
                          }
                      }
                  } catch (Exception e) {
                      // cliente desconectou
                  } finally {
                      try { s.close(); } catch (Exception e) { }
                      synchronized (clients) { clients.remove(s); }
                  }
              }

              // A TV pede o quadro seguinte ao que ja tem; o servidor espera um quadro novo (ate 2 s).
              private void serveFrame(OutputStream out, String path) throws Exception {
                  lastFrameReq = System.currentTimeMillis();
                  long after = -1;
                  int q = path.indexOf("after=");
                  if (q >= 0) {
                      try { after = Long.parseLong(path.substring(q + 6).split("&")[0]); } catch (Exception e) { }
                  }
                  byte[] f;
                  long s;
                  synchronized (lock) {
                      long deadline = System.currentTimeMillis() + 2000;
                      while (running && (frame == null || seq <= after)) {
                          long w = deadline - System.currentTimeMillis();
                          if (w <= 0) break;
                          lock.wait(w);
                      }
                      f = frame;
                      s = seq;
                  }
                  lastFrameReq = System.currentTimeMillis();
                  if (f == null || s <= after) {
                      String head = "HTTP/1.1 204 No Content\r\nX-Seq: " + s + "\r\nCache-Control: no-store\r\nConnection: keep-alive\r\n\r\n";
                      out.write(head.getBytes("ISO-8859-1"));
                      out.flush();
                      return;
                  }
                  String head = "HTTP/1.1 200 OK\r\nContent-Type: image/jpeg\r\nContent-Length: " + f.length
                          + "\r\nX-Seq: " + s + "\r\nCache-Control: no-store\r\nConnection: keep-alive\r\n\r\n";
                  out.write(head.getBytes("ISO-8859-1"));
                  out.write(f);
                  out.flush();
                  bytesSent += f.length;
              }

              private void audio(Socket s, OutputStream out) throws Exception {
                  try { s.setSendBufferSize(16 * 1024); } catch (Exception e) { }
                  LinkedBlockingQueue<byte[]> q = new LinkedBlockingQueue<byte[]>(25);
                  synchronized (audioQueues) { audioQueues.add(q); }
                  try {
                      String head = "HTTP/1.1 200 OK\r\n"
                              + "Cache-Control: no-cache, no-store\r\n"
                              + "Connection: close\r\n"
                              + "Content-Type: application/octet-stream\r\n\r\n";
                      out.write(head.getBytes("ISO-8859-1"));
                      out.flush();
                      while (running) {
                          byte[] c = q.poll(1, TimeUnit.SECONDS);
                          if (c == null) continue;
                          out.write(c);
                          out.flush();
                      }
                  } finally {
                      synchronized (audioQueues) { audioQueues.remove(q); }
                  }
              }

              public void stop() {
                  running = false;
                  try { if (serverSocket != null) serverSocket.close(); } catch (Exception e) { }
                  synchronized (clients) {
                      for (Socket s : clients) {
                          try { s.close(); } catch (Exception e) { }
                      }
                      clients.clear();
                  }
                  synchronized (lock) { lock.notifyAll(); }
                  lastFrameReq = 0;
                  tvRttMs = -1;
              }
          }
          EOF

          cat > app/src/main/java/com/tvmirror/app/AudioCapture.java <<'EOF'
          package com.tvmirror.app;

          import android.annotation.TargetApi;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioPlaybackCaptureConfiguration;
          import android.media.AudioRecord;
          import android.media.projection.MediaProjection;

          @TargetApi(29)
          public class AudioCapture {
              private final MirrorServer server;
              private final int rate;
              private final int channels;
              private final int chunk;
              private AudioRecord record;
              private Thread thread;
              private volatile boolean running = false;

              public AudioCapture(MirrorServer server, int rate, int channels) {
                  this.server = server;
                  this.rate = rate;
                  this.channels = channels;
                  this.chunk = (rate / 50) * channels * 2; // 20 ms de audio 16 bits
              }

              public void start(MediaProjection projection) throws Exception {
                  try {
                      AudioPlaybackCaptureConfiguration cfg = new AudioPlaybackCaptureConfiguration.Builder(projection)
                              .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                              .addMatchingUsage(AudioAttributes.USAGE_GAME)
                              .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                              .build();
                      AudioFormat fmt = new AudioFormat.Builder()
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setSampleRate(rate)
                              .setChannelMask(channels == 1 ? AudioFormat.CHANNEL_IN_MONO : AudioFormat.CHANNEL_IN_STEREO)
                              .build();
                      record = new AudioRecord.Builder()
                              .setAudioFormat(fmt)
                              .setBufferSizeInBytes(chunk * 8)
                              .setAudioPlaybackCaptureConfig(cfg)
                              .build();
                      if (record.getState() != AudioRecord.STATE_INITIALIZED) {
                          throw new IllegalStateException("AudioRecord nao iniciou");
                      }
                      record.startRecording();
                      running = true;
                      thread = new Thread(new Runnable() {
                          @Override public void run() { loop(); }
                      }, "audio-capture");
                      thread.start();
                  } catch (Exception e) {
                      stop();
                      throw e;
                  }
              }

              private void loop() {
                  byte[] buf = new byte[chunk];
                  while (running) {
                      int n;
                      try {
                          n = record.read(buf, 0, chunk);
                      } catch (Exception e) {
                          break;
                      }
                      if (n < 0) break;
                      if (n == 0) continue;
                      byte[] out = new byte[n];
                      System.arraycopy(buf, 0, out, 0, n);
                      server.pushAudio(out);
                  }
              }

              public void stop() {
                  running = false;
                  try { if (record != null) record.stop(); } catch (Exception e) { }
                  try { if (thread != null) thread.join(500); } catch (Exception e) { }
                  try { if (record != null) record.release(); } catch (Exception e) { }
                  record = null;
              }
          }
          EOF

          cat > app/src/main/java/com/tvmirror/app/TvLauncher.java <<'EOF'
          package com.tvmirror.app;

          import android.content.SharedPreferences;
          import android.util.Base64;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.net.SocketTimeoutException;
          import java.security.SecureRandom;
          import java.security.cert.X509Certificate;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.TimeUnit;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import javax.net.ssl.SSLContext;
          import javax.net.ssl.SSLSocket;
          import javax.net.ssl.TrustManager;
          import javax.net.ssl.X509TrustManager;

          // Procura uma TV Samsung na rede do hotspot e pede para ela abrir o navegador no endereco do app.
          public class TvLauncher {
              private static final SecureRandom RND = new SecureRandom();

              public static String openUrl(List<String> myIps, int port, SharedPreferences prefs) {
                  String tv = null;
                  String myIp = null;
                  for (String ip : myIps) {
                      String found = scan(ip);
                      if (found != null) { tv = found; myIp = ip; break; }
                  }
                  if (tv == null) {
                      return "Não achei a TV na rede. Ela está conectada ao hotspot e ligada?";
                  }
                  String url = "http://" + myIp + ":" + port;
                  String r = tryLaunch(tv, true, url, prefs);
                  if (r == null) r = tryLaunch(tv, false, url, prefs);
                  if (r == null) {
                      return "Achei a TV (" + tv + "), mas ela não aceitou o comando. Digite no navegador dela: " + url;
                  }
                  return r;
              }

              private static String scan(final String myIp) {
                  String[] o = myIp.split("\\.");
                  if (o.length != 4) return null;
                  final String prefix = o[0] + "." + o[1] + "." + o[2] + ".";
                  ExecutorService ex = Executors.newFixedThreadPool(64);
                  final List<String> hits = Collections.synchronizedList(new ArrayList<String>());
                  for (int i = 1; i < 255; i++) {
                      final String host = prefix + i;
                      if (host.equals(myIp)) continue;
                      ex.submit(new Runnable() {
                          @Override public void run() {
                              if (isOpen(host, 8002) || isOpen(host, 8001)) hits.add(host);
                          }
                      });
                  }
                  ex.shutdown();
                  try { ex.awaitTermination(8, TimeUnit.SECONDS); } catch (InterruptedException e) { }
                  ex.shutdownNow();
                  return hits.isEmpty() ? null : hits.get(0);
              }

              private static boolean isOpen(String host, int port) {
                  Socket s = new Socket();
                  try {
                      s.connect(new InetSocketAddress(host, port), 400);
                      return true;
                  } catch (Exception e) {
                      return false;
                  } finally {
                      try { s.close(); } catch (Exception e) { }
                  }
              }

              // Retorna uma mensagem se conseguiu falar com a TV; null se nao conseguiu conectar.
              private static String tryLaunch(String ip, boolean secure, String url, SharedPreferences prefs) {
                  int p = secure ? 8002 : 8001;
                  Socket raw = null;
                  Socket sock = null;
                  try {
                      raw = new Socket();
                      raw.connect(new InetSocketAddress(ip, p), 3000);
                      if (secure) {
                          SSLContext sc = SSLContext.getInstance("TLS");
                          sc.init(null, new TrustManager[] { new X509TrustManager() {
                              @Override public void checkClientTrusted(X509Certificate[] c, String a) { }
                              @Override public void checkServerTrusted(X509Certificate[] c, String a) { }
                              @Override public X509Certificate[] getAcceptedIssuers() { return new X509Certificate[0]; }
                          } }, RND);
                          SSLSocket ss = (SSLSocket) sc.getSocketFactory().createSocket(raw, ip, p, true);
                          ss.startHandshake();
                          sock = ss;
                      } else {
                          sock = raw;
                      }
                      sock.setSoTimeout(3000);
                      InputStream in = sock.getInputStream();
                      OutputStream out = sock.getOutputStream();

                      String token = prefs.getString("tvtoken_" + ip, "");
                      String name = Base64.encodeToString("TVMirror".getBytes("UTF-8"), Base64.NO_WRAP);
                      String path = "/api/v2/channels/samsung.remote.control?name=" + name
                              + (token.length() > 0 ? "&token=" + token : "");
                      byte[] kb = new byte[16];
                      RND.nextBytes(kb);
                      String key = Base64.encodeToString(kb, Base64.NO_WRAP);
                      String req = "GET " + path + " HTTP/1.1\r\nHost: " + ip + ":" + p
                              + "\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: " + key
                              + "\r\nSec-WebSocket-Version: 13\r\n\r\n";
                      out.write(req.getBytes("ISO-8859-1"));
                      out.flush();

                      String resp = readHeaders(in);
                      if (resp == null || !resp.contains(" 101")) return null;

                      long deadline = System.currentTimeMillis() + 30000;
                      long closeAfter = 0;
                      boolean sent = false;
                      Pattern tokenPat = Pattern.compile("\"token\"\\s*:\\s*\"([^\"]+)\"");
                      while (System.currentTimeMillis() < deadline) {
                          if (sent && System.currentTimeMillis() > closeAfter) break;
                          String m;
                          try {
                              sock.setSoTimeout(1000);
                              m = readFrame(sock, in);
                          } catch (SocketTimeoutException e) {
                              continue;
                          }
                          if (m == null) break;
                          if (m.length() == 0) continue;
                          if (m.contains("ms.channel.connect")) {
                              Matcher mt = tokenPat.matcher(m);
                              if (mt.find()) prefs.edit().putString("tvtoken_" + ip, mt.group(1)).apply();
                              if (!sent) {
                                  String json = "{\"method\":\"ms.channel.emit\",\"params\":{\"event\":\"ed.apps.launch\","
                                          + "\"to\":\"host\",\"data\":{\"appId\":\"org.tizen.browser\","
                                          + "\"action_type\":\"NATIVE_LAUNCH\",\"metaTag\":\"" + url + "\"}}}";
                                  sendText(out, json);
                                  sent = true;
                                  closeAfter = System.currentTimeMillis() + 2500;
                              }
                          } else if (m.contains("ms.channel.timeout") || m.contains("ms.channel.unauthorized")) {
                              return "A TV não autorizou. Aceite o aviso na tela da TV (com o controle) e tente de novo.";
                          }
                      }
                      if (sent) {
                          return "Comando enviado! A TV deve abrir o navegador. Se abrir sem o endereço, digite: " + url;
                      }
                      return "A TV não respondeu. Veja se apareceu um aviso na tela dela, aceite com o controle e tente de novo.";
                  } catch (Exception e) {
                      return null;
                  } finally {
                      try { if (sock != null) sock.close(); } catch (Exception e) { }
                      try { if (raw != null) raw.close(); } catch (Exception e) { }
                  }
              }

              private static String readHeaders(InputStream in) throws Exception {
                  StringBuilder sb = new StringBuilder();
                  int state = 0;
                  while (sb.length() < 8192) {
                      int b = in.read();
                      if (b < 0) return null;
                      sb.append((char) b);
                      if (b == '\r' && (state == 0 || state == 2)) state++;
                      else if (b == '\n' && (state == 1 || state == 3)) state++;
                      else state = 0;
                      if (state == 4) return sb.toString();
                  }
                  return null;
              }

              // null = conexao fechada; "" = quadro que nao e texto; senao o texto.
              private static String readFrame(Socket sock, InputStream in) throws Exception {
                  int b0 = in.read();
                  if (b0 < 0) return null;
                  sock.setSoTimeout(5000);
                  int opcode = b0 & 0x0F;
                  int b1 = in.read();
                  if (b1 < 0) return null;
                  boolean masked = (b1 & 0x80) != 0;
                  long len = b1 & 0x7F;
                  if (len == 126) {
                      len = (in.read() << 8) | in.read();
                  } else if (len == 127) {
                      len = 0;
                      for (int i = 0; i < 8; i++) len = (len << 8) | in.read();
                  }
                  if (len > 1000000) return null;
                  byte[] mask = new byte[4];
                  if (masked) readFully(in, mask);
                  byte[] payload = new byte[(int) len];
                  readFully(in, payload);
                  if (masked) {
                      for (int i = 0; i < payload.length; i++) payload[i] = (byte) (payload[i] ^ mask[i % 4]);
                  }
                  if (opcode == 8) return null;
                  if (opcode == 1) return new String(payload, "UTF-8");
                  return "";
              }

              private static void readFully(InputStream in, byte[] buf) throws Exception {
                  int off = 0;
                  while (off < buf.length) {
                      int n = in.read(buf, off, buf.length - off);
                      if (n < 0) throw new java.io.IOException("fim");
                      off += n;
                  }
              }

              private static void sendText(OutputStream out, String text) throws Exception {
                  byte[] p = text.getBytes("UTF-8");
                  byte[] mask = new byte[4];
                  RND.nextBytes(mask);
                  ByteArrayOutputStream b = new ByteArrayOutputStream();
                  b.write(0x81);
                  if (p.length < 126) {
                      b.write(0x80 | p.length);
                  } else {
                      b.write(0x80 | 126);
                      b.write((p.length >> 8) & 0xFF);
                      b.write(p.length & 0xFF);
                  }
                  b.write(mask, 0, 4);
                  for (int i = 0; i < p.length; i++) b.write(p[i] ^ mask[i % 4]);
                  out.write(b.toByteArray());
                  out.flush();
              }
          }

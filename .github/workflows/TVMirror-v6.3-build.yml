              static volatile boolean audioActive = false;
              static volatile int currentFps = 0;
              static final int PORT = 8080;
              static final String ACTION_STOP = "com.tvmirror.app.STOP";
              static final String ACTION_UPDATE = "com.tvmirror.app.UPDATE";

              private static final String CHANNEL = "mirror";


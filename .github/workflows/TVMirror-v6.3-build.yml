                          int oldEdge = maxEdge;
                          boolean oldAudio = wantAudio;
                          int oldRate = rate;
                          int oldCh = ch;
                          readSettings(intent);
                          if (maxEdge != oldEdge) onScreenChanged();
                          if (wantAudio != oldAudio || rate != oldRate || ch != oldCh) startAudio();
                      }
                  });
              }

              // (Re)inicia a captura de audio conforme as configuracoes e avisa a TV pelo /config.
              private void startAudio() {
                  synchronized (audioLock) {
                      audioActive = false;
                      try { if (audio != null) audio.stop(); } catch (Exception e) { }
                      audio = null;
                      if (wantAudio && Build.VERSION.SDK_INT >= 29 && projection != null

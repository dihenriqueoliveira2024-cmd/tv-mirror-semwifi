                  InputStream is = getAssets().open(name);
                  ByteArrayOutputStream b = new ByteArrayOutputStream();
                  byte[] buf = new byte[4096];
                  int n;
                  while ((n = is.read(buf)) > 0) b.write(buf, 0, n);
                  is.close();
                  return b.toByteArray();
              }


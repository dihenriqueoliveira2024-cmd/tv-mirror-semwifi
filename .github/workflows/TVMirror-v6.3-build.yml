              private void showPage(int which){
                  pageHost.removeAllViews();
                  if(which==0)pageHost.addView(homePage,new LinearLayout.LayoutParams(MATCH,MATCH));
                  else if(which==1)pageHost.addView((View)settingsPage.getTag(),new LinearLayout.LayoutParams(MATCH,MATCH));
                  else if(which==2)pageHost.addView((View)monitorPage.getTag(),new LinearLayout.LayoutParams(MATCH,MATCH));
                  else pageHost.addView((View)experimentalPage.getTag(),new LinearLayout.LayoutParams(MATCH,MATCH));
                  refresh();

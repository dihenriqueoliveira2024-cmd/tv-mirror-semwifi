              private void applyTheme() {
                  themeMode = prefs.getInt("theme_mode", 0);
                  boolean systemDark = (getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;
                  darkTheme = themeMode == 2 || (themeMode == 0 && systemDark);
                  if (darkTheme) {
                      BG=0xFF10141D; CARD=0xFF1B2230; CHIP=0xFF293448;
                      ACCENT=0xFF2F6FED; DANGER=0xFFE5484D; GREEN=0xFF45C58A;
                      AMBER=0xFFFFC266; GRAY=0xFF8491A8; TEXT=0xFFF1F5FC; ON_ACCENT=0xFF081426;
                      MUTED=0xFFADB9CC; LINK=0xFF2F6FED;
                      SURFACE=0xFF171E2A; BORDER=0xFF477FE0; GRAPH_GRID=0xFF344156;
                      STATUS_RED_BG=0xFF48272D; STATUS_GREEN_BG=0xFF1E4035; STATUS_AMBER_BG=0xFF493A25;
                  } else {
                      BG=0xFFEAF2FF; CARD=0xFFEAF1FF; CHIP=0xFFD9E6FF;
                      ACCENT=0xFF2F6FED; DANGER=0xFFE5484D; GREEN=0xFF1FA463;
                      AMBER=0xFFD98A00; GRAY=0xFF8A97B3; TEXT=0xFF0B1B3F; ON_ACCENT=0xFFFFFFFF;
                      MUTED=0xFF5B6B8C; LINK=0xFF2F6FED;
                      SURFACE=0xFFFFFFFF; BORDER=0xFF6B9BFA; GRAPH_GRID=0xFFD0DDF5;
                      STATUS_RED_BG=0xFFFDE3E3; STATUS_GREEN_BG=0xFFD8F3E3; STATUS_AMBER_BG=0xFFFFEFC2;
                  }
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  if (Build.VERSION.SDK_INT >= 23) {
                      int flags = getWindow().getDecorView().getSystemUiVisibility();
                      if (darkTheme) flags &= ~View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                      else flags |= View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                      if (Build.VERSION.SDK_INT >= 26) {
                          if (darkTheme) flags &= ~View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                          else flags |= View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                      }
                      getWindow().getDecorView().setSystemUiVisibility(flags);
                  }
              }

              private void selectTheme(int mode) {
                  prefs.edit().putInt("theme_mode", mode).apply();
                  recreate();
              }

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  prefs = getSharedPreferences("tvmirror", MODE_PRIVATE);
                  applyTheme();
                  for (int k=0;k<6;k++) sel[k] = prefs.getInt(KEYS[k], DEFAULTS[k]);
                  pageHost = column(); pageHost.setBackgroundColor(BG);
                  buildHome(); buildSettings(); buildMonitor(); buildExperimental(); showPage(0);
                  setContentView(pageHost);
                  List<String> perms = new ArrayList<String>();
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) perms.add("android.permission.POST_NOTIFICATIONS");
                  if (Build.VERSION.SDK_INT >= 29 && checkSelfPermission("android.permission.RECORD_AUDIO") != PackageManager.PERMISSION_GRANTED) perms.add("android.permission.RECORD_AUDIO");
                  if (!perms.isEmpty()) requestPermissions(perms.toArray(new String[0]),1);
                  refresh();
              }


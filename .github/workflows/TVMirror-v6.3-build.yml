      - name: Compilar APK
        working-directory: tvmirror
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp tvmirror/app/build/outputs/apk/debug/app-debug.apk TVMirror.apk

      - name: Guardar APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TVMirror-apk
          path: TVMirror.apk
          if-no-files-found: error

      - name: Publicar APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: TV Mirror APK #${{ github.run_number }}
          files: TVMirror.apk
          fail_on_unmatched_files: true

      - name: Salvar APK no repositorio (pasta apk)
        run: |
          mkdir -p apk
          cp TVMirror.apk apk/TVMirror.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk/TVMirror.apk
          git commit -m "APK #${{ github.run_number }}" || echo "sem mudancas"
          git push

      - name: Resumo com link do APK
        run: |
          echo "### APK pronto" >> "$GITHUB_STEP_SUMMARY"
          echo "Baixe aqui: https://github.com/${{ github.repository }}/releases/tag/apk-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ou direto do repositorio: https://github.com/${{ github.repository }}/raw/HEAD/apk/TVMirror.apk" >> "$GITHUB_STEP_SUMMARY"

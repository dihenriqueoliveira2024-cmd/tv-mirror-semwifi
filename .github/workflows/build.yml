          cat > app/src/main/java/com/tvmirror/app/MainActivity.java <<'EOF'
          package com.tvmirror.app;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.net.Inet4Address;
          import java.net.InetAddress;
          import java.net.NetworkInterface;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public class MainActivity extends Activity {
              private static final int REQ_CAPTURE = 1001;

              private static final int BG = 0xFF0E1014;
              private static final int CARD = 0xFF1A1D24;
              private static final int CHIP = 0xFF262B35;
              private static final int ACCENT = 0xFF4C8DFF;
              private static final int DANGER = 0xFFE5484D;
              private static final int GREEN = 0xFF30A46C;
              private static final int AMBER = 0xFFF5A524;
              private static final int GRAY = 0xFF6B7280;
              private static final int TEXT = 0xFFFFFFFF;
              private static final int MUTED = 0xFF9AA3B2;
              private static final int LINK = 0xFF7FB2FF;

              private static final String[] PRESET_NAMES = { "Fluido", "Equilibrado", "Nítido" };
              private static final String[] PRESET_DESC = {
                      "Menos atraso, imagem mais simples",
                      "Bom para a maioria dos casos",
                      "Mais detalhes, pode atrasar um pouco mais" };

              private static final int MATCH = ViewGroup.LayoutParams.MATCH_PARENT;
              private static final int WRAP = ViewGroup.LayoutParams.WRAP_CONTENT;

              private SharedPreferences prefs;
              private int preset = 1;
              private View dot;
              private TextView statusText, urlText, hintText, presetDesc, mainBtn, audioText;
              private final TextView[] chips = new TextView[3];
              private final Handler ui = new Handler(Looper.getMainLooper());
              private final Runnable ticker = new Runnable() {
                  @Override public void run() {
                      refresh();
                      ui.postDelayed(this, 1000);
                  }
              };

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable rounded(int color, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              private LinearLayout.LayoutParams lp(int w, int h, int topDp) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(w, h);
                  p.topMargin = dp(topDp);
                  return p;
              }

              private TextView text(String s, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  prefs = getSharedPreferences("tvmirror", MODE_PRIVATE);
                  preset = prefs.getInt("preset", 1);

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(BG);
                  sv.setFillViewport(true);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(22), dp(36), dp(22), dp(28));

                  root.addView(text("TV Mirror", 30, TEXT, true));
                  root.addView(text("Espelhe a tela do celular na TV pelo hotspot", 15, MUTED, false), lp(MATCH, WRAP, 4));

                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setBackground(rounded(CARD, 16));
                  card.setPadding(dp(18), dp(18), dp(18), dp(18));

                  LinearLayout statusRow = new LinearLayout(this);
                  statusRow.setOrientation(LinearLayout.HORIZONTAL);
                  statusRow.setGravity(Gravity.CENTER_VERTICAL);
                  dot = new View(this);
                  statusRow.addView(dot, new LinearLayout.LayoutParams(dp(12), dp(12)));
                  statusText = text("", 18, TEXT, true);
                  LinearLayout.LayoutParams stp = new LinearLayout.LayoutParams(WRAP, WRAP);
                  stp.leftMargin = dp(10);
                  statusRow.addView(statusText, stp);
                  card.addView(statusRow);

                  urlText = text("", 20, LINK, true);
                  urlText.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  urlText.setTextIsSelectable(true);
                  card.addView(urlText, lp(MATCH, WRAP, 14));

                  hintText = text("", 15, MUTED, false);
                  card.addView(hintText, lp(MATCH, WRAP, 10));
                  root.addView(card, lp(MATCH, WRAP, 22));

                  root.addView(text("Qualidade", 14, MUTED, true), lp(MATCH, WRAP, 24));
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  for (int i = 0; i < 3; i++) {
                      final int idx = i;
                      TextView c = text(PRESET_NAMES[i], 15, MUTED, true);
                      c.setGravity(Gravity.CENTER);
                      c.setPadding(dp(6), dp(13), dp(6), dp(13));
                      c.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) {
                              if (MirrorService.running) return;
                              preset = idx;
                              prefs.edit().putInt("preset", idx).apply();
                              refresh();
                          }
                      });
                      LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(0, WRAP, 1f);
                      if (i > 0) cp.leftMargin = dp(8);
                      row.addView(c, cp);
                      chips[i] = c;
                  }
                  root.addView(row, lp(MATCH, WRAP, 8));
                  presetDesc = text("", 13, MUTED, false);
                  root.addView(presetDesc, lp(MATCH, WRAP, 8));

                  mainBtn = text("", 18, TEXT, true);
                  mainBtn.setGravity(Gravity.CENTER);
                  mainBtn.setPadding(dp(8), dp(18), dp(8), dp(18));
                  mainBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { toggle(); }
                  });
                  root.addView(mainBtn, lp(MATCH, WRAP, 26));

                  audioText = text("", 13, MUTED, false);
                  root.addView(audioText, lp(MATCH, WRAP, 18));

                  sv.addView(root);
                  setContentView(sv);

                  List<String> perms = new ArrayList<String>();
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      perms.add("android.permission.POST_NOTIFICATIONS");
                  }
                  if (Build.VERSION.SDK_INT >= 29
                          && checkSelfPermission("android.permission.RECORD_AUDIO") != PackageManager.PERMISSION_GRANTED) {
                      perms.add("android.permission.RECORD_AUDIO");
                  }
                  if (!perms.isEmpty()) requestPermissions(perms.toArray(new String[0]), 1);

                  refresh();
              }

              @Override protected void onResume() {
                  super.onResume();
                  ui.post(ticker);
              }

              @Override protected void onPause() {
                  super.onPause();
                  ui.removeCallbacks(ticker);
              }

              private void toggle() {
                  if (MirrorService.running) {
                      stopService(new Intent(this, MirrorService.class));
                      ui.postDelayed(new Runnable() {
                          @Override public void run() { refresh(); }
                      }, 500);
                  } else {
                      MediaProjectionManager m = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      startActivityForResult(m.createScreenCaptureIntent(), REQ_CAPTURE);
                  }
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_CAPTURE && resultCode == RESULT_OK && data != null) {
                      Intent i = new Intent(this, MirrorService.class);
                      i.putExtra("code", resultCode);
                      i.putExtra("data", data);
                      i.putExtra("preset", preset);
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(i);
                      else startService(i);
                      ui.postDelayed(new Runnable() {
                          @Override public void run() { refresh(); }
                      }, 800);
                  }
              }

              private void refresh() {
                  boolean on = MirrorService.running;
                  int viewers = MirrorServer.VIEWERS.get();

                  int color;
                  String status;
                  if (!on) { color = GRAY; status = "Parado"; }
                  else if (viewers > 0) { color = GREEN; status = "TV conectada"; }
                  else { color = AMBER; status = "Aguardando a TV…"; }
                  dot.setBackground(rounded(color, 6));
                  statusText.setText(status);

                  if (on) {
                      StringBuilder sb = new StringBuilder();
                      for (String ip : localIps()) {
                          if (sb.length() > 0) sb.append("\n");
                          sb.append("http://").append(ip).append(":").append(MirrorService.PORT);
                      }
                      if (sb.length() == 0) sb.append("Ligue o hotspot");
                      urlText.setVisibility(View.VISIBLE);
                      urlText.setText(sb.toString());
                      hintText.setText("Abra este endereço no navegador (Internet) da TV.");
                  } else {
                      urlText.setVisibility(View.GONE);
                      hintText.setText("1. Ligue o hotspot do celular\n2. Conecte a TV nele\n3. Toque em Iniciar\n4. Abra o endereço mostrado no navegador da TV\n\nDica: hotspot em 5 GHz reduz o atraso.");
                  }

                  for (int i = 0; i < 3; i++) {
                      boolean sel = (i == preset);
                      chips[i].setBackground(rounded(sel ? ACCENT : CHIP, 12));
                      chips[i].setTextColor(sel ? TEXT : MUTED);
                      chips[i].setAlpha(on ? 0.5f : 1f);
                  }
                  presetDesc.setText(PRESET_DESC[preset]);

                  mainBtn.setText(on ? "Parar espelhamento" : "Iniciar espelhamento");
                  mainBtn.setBackground(rounded(on ? DANGER : ACCENT, 14));

                  String a;
                  if (Build.VERSION.SDK_INT < 29) {
                      a = "Som: indisponível neste Android (precisa do 10 ou superior). O vídeo funciona normalmente.";
                  } else if (on) {
                      a = MirrorService.audioActive
                              ? "Som: ativo. Na TV, aperte OK no controle para ligar. Setas esquerda/direita ajustam o atraso."
                              : "Som: indisponível. Permita o microfone nas permissões do app e inicie de novo.";
                  } else {
                      a = "Som: disponível neste celular (Android 10+).";
                  }
                  audioText.setText(a);
              }

              private static List<String> localIps() {
                  List<String> r = new ArrayList<String>();
                  try {
                      for (NetworkInterface ni : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          if (!ni.isUp() || ni.isLoopback()) continue;
                          String n = ni.getName();
                          if (n.startsWith("rmnet") || n.startsWith("ccmni") || n.startsWith("dummy")
                                  || n.startsWith("tun") || n.startsWith("v4-")) continue;
                          for (InetAddress a : Collections.list(ni.getInetAddresses())) {
                              if (a instanceof Inet4Address && !a.isLoopbackAddress()) {
                                  r.add(a.getHostAddress());
                              }
                          }
                      }
                  } catch (Exception e) { }
                  return r;
              }
          }

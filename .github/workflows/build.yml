name: Build TV Mirror APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar arquivos do projeto
        run: |
          set -e
          mkdir -p tvmirror/app/src/main/java/com/tvmirror/app tvmirror/app/src/main/assets
          cd tvmirror

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'TVMirror'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tvmirror.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.tvmirror.app'
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:label="TV Mirror"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MirrorService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <title>TV Mirror</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; font-family: sans-serif; }
            #v { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
            .pill { position: fixed; left: 24px; padding: 10px 22px; border-radius: 999px; background: rgba(20,22,28,0.85); color: #fff; font-size: 22px; }
            #msg { top: 24px; }
            #snd { bottom: 24px; color: #ffd166; }
          </style>
          </head>
          <body>
          <img id="v" alt="">
          <div id="msg" class="pill">Conectando...</div>
          <div id="snd" class="pill">Som: aperte OK no controle para ativar</div>
          <script>
            var v = document.getElementById('v');
            var msg = document.getElementById('msg');
            var snd = document.getElementById('snd');

            function startVideo() { v.src = '/stream?' + Date.now(); }
            v.onerror = function () {
              msg.style.display = 'block';
              msg.textContent = 'Reconectando...';
              setTimeout(startVideo, 1000);
            };
            setInterval(function () { if (v.naturalWidth > 0) msg.style.display = 'none'; }, 500);
            startVideo();

            var ctx = null, nextTime = 0, delay = 0.15, started = false, leftover = null;

            function flash(text) {
              snd.style.display = 'block';
              snd.textContent = text;
              setTimeout(function () { snd.style.display = 'none'; }, 1800);
            }

            function activate(e) {
              if (!started) {
                started = true;
                try {
                  var el = document.documentElement;
                  if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
                } catch (err) {}
                var AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) { snd.textContent = 'Este navegador nao suporta som'; return; }
                ctx = new AC();
                snd.style.display = 'none';
                pumpAudio();
              }
              if (ctx && ctx.state === 'suspended' && ctx.resume) ctx.resume();
              if (e && e.type === 'keydown' && ctx) {
                var c = e.keyCode, changed = false;
                if (c === 39) { delay += 0.05; changed = true; }
                if (c === 37) { delay = Math.max(0.02, delay - 0.05); changed = true; }
                if (changed) {
                  nextTime = 0;
                  flash('Atraso do som: ' + Math.round(delay * 1000) + ' ms');
                }
              }
            }
            document.addEventListener('keydown', activate);
            document.addEventListener('click', activate);

            function pumpAudio() {
              fetch('/audio').then(function (res) {
                var reader = res.body.getReader();
                leftover = null;
                function read() {
                  reader.read().then(function (r) {
                    if (r.done) { setTimeout(pumpAudio, 1000); return; }
                    playChunk(r.value);
                    read();
                  }).catch(function () { setTimeout(pumpAudio, 1000); });
                }
                read();
              }).catch(function () { setTimeout(pumpAudio, 1000); });
            }

            function playChunk(chunk) {
              var data = chunk;
              if (leftover) {
                var m = new Uint8Array(leftover.length + chunk.length);
                m.set(leftover, 0);
                m.set(chunk, leftover.length);
                data = m;
              }
              var frames = Math.floor(data.length / 4);
              var used = frames * 4;
              leftover = used < data.length ? data.slice(used) : null;
              if (frames === 0) return;
              var now = ctx.currentTime;
              if (nextTime < now + 0.02) nextTime = now + delay;
              else if (nextTime > now + delay + 0.4) return;
              var buf = ctx.createBuffer(2, frames, 48000);
              var L = buf.getChannelData(0), R = buf.getChannelData(1);
              var dv = new DataView(data.buffer, data.byteOffset, used);
              for (var i = 0; i < frames; i++) {
                L[i] = dv.getInt16(i * 4, true) / 32768;
                R[i] = dv.getInt16(i * 4 + 2, true) / 32768;
              }
              var src = ctx.createBufferSource();
              src.buffer = buf;
              src.connect(ctx.destination);
              src.start(nextTime);
              nextTime += buf.duration;
            }
          </script>
          </body>
          </html>
          EOF

          cat > app/src/main/java/com/tvmirror/app/MirrorServer.java <<'EOF'
          package com.tvmirror.app;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.LinkedBlockingQueue;
          import java.util.concurrent.TimeUnit;
          import java.util.concurrent.atomic.AtomicInteger;

          public class MirrorServer {
              static final AtomicInteger VIEWERS = new AtomicInteger(0);

              private final int port;
              private final byte[] html;
              private ServerSocket serverSocket;
              private volatile boolean running = false;
              private final Object lock = new Object();
              private byte[] frame = null;
              private long seq = 0;
              private final List<Socket> clients = new ArrayList<Socket>();
              private final List<LinkedBlockingQueue<byte[]>> audioQueues = new ArrayList<LinkedBlockingQueue<byte[]>>();

              public MirrorServer(int port, byte[] html) {
                  this.port = port;
                  this.html = html;
              }

              public void start() throws Exception {
                  serverSocket = new ServerSocket();
                  serverSocket.setReuseAddress(true);
                  serverSocket.bind(new InetSocketAddress(port));
                  running = true;
                  Thread t = new Thread(new Runnable() {
                      @Override public void run() { acceptLoop(); }
                  }, "mirror-accept");
                  t.start();
              }

              private void acceptLoop() {
                  while (running) {
                      try {
                          final Socket s = serverSocket.accept();
                          synchronized (clients) { clients.add(s); }
                          Thread t = new Thread(new Runnable() {
                              @Override public void run() { handle(s); }
                          }, "mirror-client");
                          t.start();
                      } catch (Exception e) {
                          if (!running) return;
                      }
                  }
              }

              public void push(byte[] jpeg) {
                  synchronized (lock) {
                      frame = jpeg;
                      seq++;
                      lock.notifyAll();
                  }
              }

              public void pushAudio(byte[] chunk) {
                  synchronized (audioQueues) {
                      for (LinkedBlockingQueue<byte[]> q : audioQueues) {
                          while (!q.offer(chunk)) { q.poll(); }
                      }
                  }
              }

              private void handle(Socket s) {
                  try {
                      s.setTcpNoDelay(true);
                      s.setSendBufferSize(128 * 1024);
                      s.setSoTimeout(10000);
                      BufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream(), "ISO-8859-1"));
                      String line = in.readLine();
                      if (line == null) return;
                      String h;
                      while ((h = in.readLine()) != null && h.length() > 0) { }
                      s.setSoTimeout(0);
                      String[] parts = line.split(" ");
                      String path = parts.length > 1 ? parts[1] : "/";
                      OutputStream out = s.getOutputStream();
                      if (path.startsWith("/stream")) {
                          stream(out);
                      } else if (path.startsWith("/audio")) {
                          audio(s, out);
                      } else if (path.equals("/") || path.startsWith("/index")) {
                          String head = "HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\n"
                                  + "Cache-Control: no-cache\r\n"
                                  + "Content-Length: " + html.length + "\r\nConnection: close\r\n\r\n";
                          out.write(head.getBytes("ISO-8859-1"));
                          out.write(html);
                          out.flush();
                      } else {
                          out.write("HTTP/1.1 404 Not Found\r\nContent-Length: 0\r\nConnection: close\r\n\r\n".getBytes("ISO-8859-1"));
                          out.flush();
                      }
                  } catch (Exception e) {
                      // cliente desconectou
                  } finally {
                      try { s.close(); } catch (Exception e) { }
                      synchronized (clients) { clients.remove(s); }
                  }
              }

              private void stream(OutputStream out) throws Exception {
                  VIEWERS.incrementAndGet();
                  try {
                      String head = "HTTP/1.1 200 OK\r\n"
                              + "Cache-Control: no-cache, no-store\r\n"
                              + "Pragma: no-cache\r\n"
                              + "Connection: close\r\n"
                              + "Content-Type: multipart/x-mixed-replace; boundary=frame\r\n\r\n";
                      out.write(head.getBytes("ISO-8859-1"));
                      out.flush();
                      long last = -1;
                      while (running) {
                          byte[] f;
                          synchronized (lock) {
                              while (running && seq == last) lock.wait(1000);
                              f = frame;
                              last = seq;
                          }
                          if (f == null) continue;
                          String part = "--frame\r\nContent-Type: image/jpeg\r\nContent-Length: " + f.length + "\r\n\r\n";
                          out.write(part.getBytes("ISO-8859-1"));
                          out.write(f);
                          out.write("\r\n".getBytes("ISO-8859-1"));
                          out.flush();
                      }
                  } finally {
                      VIEWERS.decrementAndGet();
                  }
              }

              private void audio(Socket s, OutputStream out) throws Exception {
                  try { s.setSendBufferSize(16 * 1024); } catch (Exception e) { }
                  LinkedBlockingQueue<byte[]> q = new LinkedBlockingQueue<byte[]>(25);
                  synchronized (audioQueues) { audioQueues.add(q); }
                  try {
                      String head = "HTTP/1.1 200 OK\r\n"
                              + "Cache-Control: no-cache, no-store\r\n"
                              + "Connection: close\r\n"
                              + "Content-Type: application/octet-stream\r\n\r\n";
                      out.write(head.getBytes("ISO-8859-1"));
                      out.flush();
                      while (running) {
                          byte[] c = q.poll(1, TimeUnit.SECONDS);
                          if (c == null) continue;
                          out.write(c);
                          out.flush();
                      }
                  } finally {
                      synchronized (audioQueues) { audioQueues.remove(q); }
                  }
              }

              public void stop() {
                  running = false;
                  try { if (serverSocket != null) serverSocket.close(); } catch (Exception e) { }
                  synchronized (clients) {
                      for (Socket s : clients) {
                          try { s.close(); } catch (Exception e) { }
                      }
                      clients.clear();
                  }
                  synchronized (lock) { lock.notifyAll(); }
                  VIEWERS.set(0);
              }
          }
          EOF

          cat > app/src/main/java/com/tvmirror/app/AudioCapture.java <<'EOF'
          package com.tvmirror.app;

          import android.annotation.TargetApi;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioPlaybackCaptureConfiguration;
          import android.media.AudioRecord;
          import android.media.projection.MediaProjection;

          @TargetApi(29)
          public class AudioCapture {
              private static final int RATE = 48000;
              private static final int CHUNK = 960 * 4; // 20 ms, estereo 16 bits
              private final MirrorServer server;
              private AudioRecord record;
              private Thread thread;
              private volatile boolean running = false;

              public AudioCapture(MirrorServer server) {
                  this.server = server;
              }

              public void start(MediaProjection projection) {
                  AudioPlaybackCaptureConfiguration cfg = new AudioPlaybackCaptureConfiguration.Builder(projection)
                          .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                          .addMatchingUsage(AudioAttributes.USAGE_GAME)
                          .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                          .build();
                  AudioFormat fmt = new AudioFormat.Builder()
                          .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                          .setSampleRate(RATE)
                          .setChannelMask(AudioFormat.CHANNEL_IN_STEREO)
                          .build();
                  record = new AudioRecord.Builder()
                          .setAudioFormat(fmt)
                          .setBufferSizeInBytes(CHUNK * 8)
                          .setAudioPlaybackCaptureConfig(cfg)
                          .build();
                  if (record.getState() != AudioRecord.STATE_INITIALIZED) {
                      throw new IllegalStateException("AudioRecord nao iniciou");
                  }
                  record.startRecording();
                  running = true;
                  thread = new Thread(new Runnable() {
                      @Override public void run() { loop(); }
                  }, "audio-capture");
                  thread.start();
              }

              private void loop() {
                  byte[] buf = new byte[CHUNK];
                  while (running) {
                      int n;
                      try {
                          n = record.read(buf, 0, CHUNK);
                      } catch (Exception e) {
                          break;
                      }
                      if (n < 0) break;
                      if (n == 0) continue;
                      byte[] out = new byte[n];
                      System.arraycopy(buf, 0, out, 0, n);
                      server.pushAudio(out);
                  }
              }

              public void stop() {
                  running = false;
                  try { if (record != null) record.stop(); } catch (Exception e) { }
                  try { if (thread != null) thread.join(500); } catch (Exception e) { }
                  try { if (record != null) record.release(); } catch (Exception e) { }
                  record = null;
              }
          }
          EOF

          cat > app/src/main/java/com/tvmirror/app/MirrorService.java <<'EOF'
          package com.tvmirror.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.Process;
          import android.os.SystemClock;
          import android.util.DisplayMetrics;
          import android.view.Display;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.nio.ByteBuffer;

          public class MirrorService extends Service {
              static volatile boolean running = false;
              static volatile boolean audioActive = false;
              static final int PORT = 8080;
              static final String ACTION_STOP = "com.tvmirror.app.STOP";

              // presets: 0 = Fluido, 1 = Equilibrado, 2 = Nitido
              private static final int[] MAX_EDGE = { 960, 1280, 1920 };
              private static final int[] QUALITY = { 60, 70, 80 };
              private static final int[] INTERVAL_MS = { 25, 33, 42 };
              private static final String CHANNEL = "mirror";

              private int maxEdge = 1280;
              private int quality = 70;
              private int minIntervalMs = 33;

              private MediaProjection projection;
              private MediaProjection.Callback projCallback;
              private VirtualDisplay vd;
              private ImageReader reader;
              private HandlerThread thread;
              private Handler handler;
              private MirrorServer server;
              private DisplayManager dm;
              private DisplayManager.DisplayListener dispListener;
              private AudioCapture audio;
              private PowerManager.WakeLock wl;
              private int capW, capH, dpi;
              private Bitmap bmp;
              private long lastFrameMs = 0;
              private boolean framePending = false;
              private final ByteArrayOutputStream baos = new ByteArrayOutputStream(256 * 1024);

              private final Runnable pendingTask = new Runnable() {
                  @Override public void run() {
                      framePending = false;
                      if (reader != null) processFrame(reader);
                  }
              };

              @Override public IBinder onBind(Intent i) { return null; }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  Notification n = buildNotification();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  } else {
                      startForeground(1, n);
                  }
                  if (running) return START_NOT_STICKY;
                  if (intent == null) { stopSelf(); return START_NOT_STICKY; }
                  try {
                      setup(intent);
                      running = true;
                  } catch (Exception e) {
                      cleanup();
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }

              private void setup(Intent intent) throws Exception {
                  int code = intent.getIntExtra("code", 0);
                  Intent data = (Intent) intent.getParcelableExtra("data");
                  int p = intent.getIntExtra("preset", 1);
                  if (p < 0 || p > 2) p = 1;
                  maxEdge = MAX_EDGE[p];
                  quality = QUALITY[p];
                  minIntervalMs = INTERVAL_MS[p];

                  MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);

                  thread = new HandlerThread("capture", Process.THREAD_PRIORITY_DISPLAY);
                  thread.start();
                  handler = new Handler(thread.getLooper());

                  projection = mpm.getMediaProjection(code, data);
                  projCallback = new MediaProjection.Callback() {
                      @Override public void onStop() { stopSelf(); }
                  };
                  projection.registerCallback(projCallback, handler);

                  server = new MirrorServer(PORT, readAsset("index.html"));
                  server.start();

                  dm = (DisplayManager) getSystemService(DISPLAY_SERVICE);
                  int[] s = computeSize();
                  capW = s[0]; capH = s[1]; dpi = s[2];

                  reader = makeReader();
                  vd = projection.createVirtualDisplay("tvmirror", capW, capH, dpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.getSurface(), null, handler);

                  dispListener = new DisplayManager.DisplayListener() {
                      @Override public void onDisplayAdded(int id) { }
                      @Override public void onDisplayRemoved(int id) { }
                      @Override public void onDisplayChanged(int id) {
                          if (id == Display.DEFAULT_DISPLAY) onScreenChanged();
                      }
                  };
                  dm.registerDisplayListener(dispListener, handler);

                  if (Build.VERSION.SDK_INT >= 29
                          && checkSelfPermission("android.permission.RECORD_AUDIO") == PackageManager.PERMISSION_GRANTED) {
                      try {
                          audio = new AudioCapture(server);
                          audio.start(projection);
                          audioActive = true;
                      } catch (Exception e) {
                          audio = null;
                          audioActive = false;
                      }
                  }

                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "tvmirror:capture");
                  wl.acquire();
              }

              private byte[] readAsset(String name) throws Exception {
                  InputStream is = getAssets().open(name);
                  ByteArrayOutputStream b = new ByteArrayOutputStream();
                  byte[] buf = new byte[4096];
                  int n;
                  while ((n = is.read(buf)) > 0) b.write(buf, 0, n);
                  is.close();
                  return b.toByteArray();
              }

              private int[] computeSize() {
                  DisplayMetrics m = new DisplayMetrics();
                  dm.getDisplay(Display.DEFAULT_DISPLAY).getRealMetrics(m);
                  int longEdge = Math.max(m.widthPixels, m.heightPixels);
                  float scale = longEdge > maxEdge ? (float) maxEdge / longEdge : 1f;
                  int w = Math.max(2, ((int) (m.widthPixels * scale)) & ~1);
                  int h = Math.max(2, ((int) (m.heightPixels * scale)) & ~1);
                  return new int[] { w, h, m.densityDpi };
              }

              private ImageReader makeReader() {
                  ImageReader r = ImageReader.newInstance(capW, capH, PixelFormat.RGBA_8888, 2);
                  r.setOnImageAvailableListener(new ImageReader.OnImageAvailableListener() {
                      @Override public void onImageAvailable(ImageReader rd) { onFrameAvailable(rd); }
                  }, handler);
                  return r;
              }

              private void onScreenChanged() {
                  try {
                      if (vd == null) return;
                      int[] s = computeSize();
                      if (s[0] == capW && s[1] == capH) return;
                      capW = s[0]; capH = s[1]; dpi = s[2];
                      ImageReader old = reader;
                      reader = makeReader();
                      vd.setSurface(reader.getSurface());
                      vd.resize(capW, capH, dpi);
                      old.close();
                      bmp = null;
                  } catch (Exception e) {
                      // ignora
                  }
              }

              private void onFrameAvailable(ImageReader rd) {
                  if (rd != reader) return;
                  long wait = minIntervalMs - (SystemClock.uptimeMillis() - lastFrameMs);
                  if (wait > 0) {
                      if (!framePending) {
                          framePending = true;
                          handler.postDelayed(pendingTask, wait);
                      }
                      return;
                  }
                  processFrame(rd);
              }

              private void processFrame(ImageReader rd) {
                  lastFrameMs = SystemClock.uptimeMillis();
                  Image img = null;
                  try {
                      img = rd.acquireLatestImage();
                      if (img == null) return;
                      Image.Plane p = img.getPlanes()[0];
                      ByteBuffer buf = p.getBuffer();
                      int pixelStride = p.getPixelStride();
                      int rowStride = p.getRowStride();
                      int fullW = rowStride / pixelStride;
                      int w = img.getWidth();
                      int h = img.getHeight();
                      if (bmp == null || bmp.getWidth() != fullW || bmp.getHeight() != h) {
                          bmp = Bitmap.createBitmap(fullW, h, Bitmap.Config.ARGB_8888);
                      }
                      bmp.copyPixelsFromBuffer(buf);
                      Bitmap out = bmp;
                      if (fullW != w) out = Bitmap.createBitmap(bmp, 0, 0, w, h);
                      baos.reset();
                      out.compress(Bitmap.CompressFormat.JPEG, quality, baos);
                      if (out != bmp) out.recycle();
                      if (server != null) server.push(baos.toByteArray());
                  } catch (Exception e) {
                      // ignora frame com erro
                  } finally {
                      if (img != null) img.close();
                  }
              }

              private Notification buildNotification() {
                  Intent open = new Intent(this, MainActivity.class);
                  int piFlags = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, piFlags);
                  Intent stop = new Intent(this, MirrorService.class);
                  stop.setAction(ACTION_STOP);
                  PendingIntent stopPi = PendingIntent.getService(this, 1, stop, piFlags);
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      nm.createNotificationChannel(new NotificationChannel(CHANNEL, "Espelhamento", NotificationManager.IMPORTANCE_LOW));
                      b = new Notification.Builder(this, CHANNEL);
                  } else {
                      b = new Notification.Builder(this);
                  }
                  return b.setContentTitle("Espelhando a tela")
                          .setContentText("Abra o endereco no navegador da TV")
                          .setSmallIcon(android.R.drawable.ic_menu_share)
                          .setContentIntent(pi)
                          .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Parar", stopPi)
                          .setOngoing(true)
                          .build();
              }

              private void cleanup() {
                  running = false;
                  audioActive = false;
                  try { if (handler != null) handler.removeCallbacks(pendingTask); } catch (Exception e) { }
                  try { if (audio != null) audio.stop(); } catch (Exception e) { }
                  audio = null;
                  try { if (dm != null && dispListener != null) dm.unregisterDisplayListener(dispListener); } catch (Exception e) { }
                  try { if (vd != null) vd.release(); } catch (Exception e) { }
                  try { if (reader != null) reader.close(); } catch (Exception e) { }
                  try {
                      if (projection != null) {
                          if (projCallback != null) projection.unregisterCallback(projCallback);
                          projection.stop();
                      }
                  } catch (Exception e) { }
                  try { if (server != null) server.stop(); } catch (Exception e) { }
                  try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception e) { }
                  try { if (thread != null) thread.quitSafely(); } catch (Exception e) { }
                  vd = null; reader = null; projection = null; server = null;
                  wl = null; thread = null; dispListener = null; bmp = null;
              }

              @Override public void onDestroy() {
                  cleanup();
                  super.onDestroy();
              }
          }

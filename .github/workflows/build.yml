name: Build TV Mirror APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar arquivos do projeto
        run: |
          set -e
          mkdir -p tvmirror/app/src/main/java/com/tvmirror/app tvmirror/app/src/main/assets
          cd tvmirror

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'TVMirror'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tvmirror.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.tvmirror.app'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:label="TV Mirror"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MirrorService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <title>Espelhamento</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
            img { width: 100vw; height: 100vh; object-fit: contain; display: block; }
            #msg { position: fixed; top: 12px; left: 12px; color: #888; font: 18px sans-serif; }
          </style>
          </head>
          <body>
          <img id="v" alt="">
          <div id="msg">Conectando...</div>
          <script>
            var v = document.getElementById('v');
            var m = document.getElementById('msg');
            function start() { v.src = '/stream?' + Date.now(); }
            v.onload = function () { m.style.display = 'none'; };
            v.onerror = function () {
              m.style.display = 'block';
              m.textContent = 'Reconectando...';
              setTimeout(start, 1000);
            };
            start();
          </script>
          </body>
          </html>
          EOF

          cat > app/src/main/java/com/tvmirror/app/MirrorServer.java <<'EOF'
          package com.tvmirror.app;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.util.ArrayList;
          import java.util.List;

          public class MirrorServer {
              private final int port;
              private final byte[] html;
              private ServerSocket serverSocket;
              private volatile boolean running = false;
              private final Object lock = new Object();
              private byte[] frame = null;
              private long seq = 0;
              private final List<Socket> clients = new ArrayList<Socket>();

              public MirrorServer(int port, byte[] html) {
                  this.port = port;
                  this.html = html;
              }

              public void start() throws Exception {
                  serverSocket = new ServerSocket();
                  serverSocket.setReuseAddress(true);
                  serverSocket.bind(new InetSocketAddress(port));
                  running = true;
                  Thread t = new Thread(new Runnable() {
                      @Override public void run() { acceptLoop(); }
                  }, "mirror-accept");
                  t.start();
              }

              private void acceptLoop() {
                  while (running) {
                      try {
                          final Socket s = serverSocket.accept();
                          synchronized (clients) { clients.add(s); }
                          Thread t = new Thread(new Runnable() {
                              @Override public void run() { handle(s); }
                          }, "mirror-client");
                          t.start();
                      } catch (Exception e) {
                          if (!running) return;
                      }
                  }
              }

              public void push(byte[] jpeg) {
                  synchronized (lock) {
                      frame = jpeg;
                      seq++;
                      lock.notifyAll();
                  }
              }

              private void handle(Socket s) {
                  try {
                      s.setTcpNoDelay(true);
                      s.setSendBufferSize(128 * 1024);
                      s.setSoTimeout(10000);
                      BufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream(), "ISO-8859-1"));
                      String line = in.readLine();
                      if (line == null) return;
                      String h;
                      while ((h = in.readLine()) != null && h.length() > 0) { }
                      s.setSoTimeout(0);
                      String[] parts = line.split(" ");
                      String path = parts.length > 1 ? parts[1] : "/";
                      OutputStream out = s.getOutputStream();
                      if (path.startsWith("/stream")) {
                          stream(out);
                      } else if (path.equals("/") || path.startsWith("/index")) {
                          String head = "HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\n"
                                  + "Content-Length: " + html.length + "\r\nConnection: close\r\n\r\n";
                          out.write(head.getBytes("ISO-8859-1"));
                          out.write(html);
                          out.flush();
                      } else {
                          out.write("HTTP/1.1 404 Not Found\r\nContent-Length: 0\r\nConnection: close\r\n\r\n".getBytes("ISO-8859-1"));
                          out.flush();
                      }
                  } catch (Exception e) {
                      // cliente desconectou
                  } finally {
                      try { s.close(); } catch (Exception e) { }
                      synchronized (clients) { clients.remove(s); }
                  }
              }

              private void stream(OutputStream out) throws Exception {
                  String head = "HTTP/1.1 200 OK\r\n"
                          + "Cache-Control: no-cache, no-store\r\n"
                          + "Pragma: no-cache\r\n"
                          + "Connection: close\r\n"
                          + "Content-Type: multipart/x-mixed-replace; boundary=frame\r\n\r\n";
                  out.write(head.getBytes("ISO-8859-1"));
                  out.flush();
                  long last = -1;
                  while (running) {
                      byte[] f;
                      synchronized (lock) {
                          while (running && seq == last) lock.wait(1000);
                          f = frame;
                          last = seq;
                      }
                      if (f == null) continue;
                      String part = "--frame\r\nContent-Type: image/jpeg\r\nContent-Length: " + f.length + "\r\n\r\n";
                      out.write(part.getBytes("ISO-8859-1"));
                      out.write(f);
                      out.write("\r\n".getBytes("ISO-8859-1"));
                      out.flush();
                  }
              }

              public void stop() {
                  running = false;
                  try { if (serverSocket != null) serverSocket.close(); } catch (Exception e) { }
                  synchronized (clients) {
                      for (Socket s : clients) {
                          try { s.close(); } catch (Exception e) { }
                      }
                      clients.clear();
                  }
                  synchronized (lock) { lock.notifyAll(); }
              }
          }
          EOF

          cat > app/src/main/java/com/tvmirror/app/MirrorService.java <<'EOF'
          package com.tvmirror.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.util.DisplayMetrics;
          import android.view.Display;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.nio.ByteBuffer;

          public class MirrorService extends Service {
              static volatile boolean running = false;
              static final int PORT = 8080;
              private static final int MAX_LONG_EDGE = 1280;
              private static final int JPEG_QUALITY = 70;
              private static final String CHANNEL = "mirror";

              private MediaProjection projection;
              private MediaProjection.Callback projCallback;
              private VirtualDisplay vd;
              private ImageReader reader;
              private HandlerThread thread;
              private Handler handler;
              private MirrorServer server;
              private DisplayManager dm;
              private DisplayManager.DisplayListener dispListener;
              private PowerManager.WakeLock wl;
              private int capW, capH, dpi;
              private Bitmap bmp;
              private final ByteArrayOutputStream baos = new ByteArrayOutputStream(256 * 1024);

              @Override public IBinder onBind(Intent i) { return null; }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  Notification n = buildNotification();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  } else {
                      startForeground(1, n);
                  }
                  if (running) return START_NOT_STICKY;
                  if (intent == null) { stopSelf(); return START_NOT_STICKY; }
                  try {
                      setup(intent);
                      running = true;
                  } catch (Exception e) {
                      cleanup();
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }

              private void setup(Intent intent) throws Exception {
                  int code = intent.getIntExtra("code", 0);
                  Intent data = (Intent) intent.getParcelableExtra("data");
                  MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);

                  thread = new HandlerThread("capture");
                  thread.start();
                  handler = new Handler(thread.getLooper());

                  projection = mpm.getMediaProjection(code, data);
                  projCallback = new MediaProjection.Callback() {
                      @Override public void onStop() { stopSelf(); }
                  };
                  projection.registerCallback(projCallback, handler);

                  server = new MirrorServer(PORT, readAsset("index.html"));
                  server.start();

                  dm = (DisplayManager) getSystemService(DISPLAY_SERVICE);
                  int[] s = computeSize();
                  capW = s[0]; capH = s[1]; dpi = s[2];

                  reader = makeReader();
                  vd = projection.createVirtualDisplay("tvmirror", capW, capH, dpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.getSurface(), null, handler);

                  dispListener = new DisplayManager.DisplayListener() {
                      @Override public void onDisplayAdded(int id) { }
                      @Override public void onDisplayRemoved(int id) { }
                      @Override public void onDisplayChanged(int id) {
                          if (id == Display.DEFAULT_DISPLAY) onScreenChanged();
                      }
                  };
                  dm.registerDisplayListener(dispListener, handler);

                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "tvmirror:capture");
                  wl.acquire();
              }

              private byte[] readAsset(String name) throws Exception {
                  InputStream is = getAssets().open(name);
                  ByteArrayOutputStream b = new ByteArrayOutputStream();
                  byte[] buf = new byte[4096];
                  int n;
                  while ((n = is.read(buf)) > 0) b.write(buf, 0, n);
                  is.close();
                  return b.toByteArray();
              }

              private int[] computeSize() {
                  DisplayMetrics m = new DisplayMetrics();
                  dm.getDisplay(Display.DEFAULT_DISPLAY).getRealMetrics(m);
                  int longEdge = Math.max(m.widthPixels, m.heightPixels);
                  float scale = longEdge > MAX_LONG_EDGE ? (float) MAX_LONG_EDGE / longEdge : 1f;
                  int w = Math.max(2, ((int) (m.widthPixels * scale)) & ~1);
                  int h = Math.max(2, ((int) (m.heightPixels * scale)) & ~1);
                  return new int[] { w, h, m.densityDpi };
              }

              private ImageReader makeReader() {
                  ImageReader r = ImageReader.newInstance(capW, capH, PixelFormat.RGBA_8888, 2);
                  r.setOnImageAvailableListener(new ImageReader.OnImageAvailableListener() {
                      @Override public void onImageAvailable(ImageReader rd) { handleFrame(rd); }
                  }, handler);
                  return r;
              }

              private void onScreenChanged() {
                  try {
                      if (vd == null) return;
                      int[] s = computeSize();
                      if (s[0] == capW && s[1] == capH) return;
                      capW = s[0]; capH = s[1]; dpi = s[2];
                      ImageReader old = reader;
                      reader = makeReader();
                      vd.setSurface(reader.getSurface());
                      vd.resize(capW, capH, dpi);
                      old.close();
                      bmp = null;
                  } catch (Exception e) {
                      // ignora
                  }
              }

              private void handleFrame(ImageReader rd) {
                  Image img = null;
                  try {
                      img = rd.acquireLatestImage();
                      if (img == null) return;
                      Image.Plane p = img.getPlanes()[0];
                      ByteBuffer buf = p.getBuffer();
                      int pixelStride = p.getPixelStride();
                      int rowStride = p.getRowStride();
                      int fullW = rowStride / pixelStride;
                      int w = img.getWidth();
                      int h = img.getHeight();
                      if (bmp == null || bmp.getWidth() != fullW || bmp.getHeight() != h) {
                          bmp = Bitmap.createBitmap(fullW, h, Bitmap.Config.ARGB_8888);
                      }
                      bmp.copyPixelsFromBuffer(buf);
                      Bitmap out = bmp;
                      if (fullW != w) out = Bitmap.createBitmap(bmp, 0, 0, w, h);
                      baos.reset();
                      out.compress(Bitmap.CompressFormat.JPEG, JPEG_QUALITY, baos);
                      if (out != bmp) out.recycle();
                      if (server != null) server.push(baos.toByteArray());
                  } catch (Exception e) {
                      // ignora frame com erro
                  } finally {
                      if (img != null) img.close();
                  }
              }

              private Notification buildNotification() {
                  Intent open = new Intent(this, MainActivity.class);
                  int piFlags = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, piFlags);
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      nm.createNotificationChannel(new NotificationChannel(CHANNEL, "Espelhamento", NotificationManager.IMPORTANCE_LOW));
                      b = new N

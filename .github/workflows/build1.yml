              // Retorna uma mensagem se conseguiu falar com a TV; null se nao conseguiu conectar.
              private static String tryLaunch(String ip, boolean secure, String url, SharedPreferences prefs) {
                  int p = secure ? 8002 : 8001;
                  Socket raw = null;
                  Socket sock = null;
                  try {
                      raw = new Socket();
                      raw.connect(new InetSocketAddress(ip, p), 3000);
                      if (secure) {
                          SSLContext sc = SSLContext.getInstance("TLS");
                          sc.init(null, new TrustManager[] { new X509TrustManager() {
                              @Override public void checkClientTrusted(X509Certificate[] c, String a) { }
                              @Override public void checkServerTrusted(X509Certificate[] c, String a) { }
                              @Override public X509Certificate[] getAcceptedIssuers() { return new X509Certificate[0]; }
                          } }, RND);
                          SSLSocket ss = (SSLSocket) sc.getSocketFactory().createSocket(raw, ip, p, true);
                          ss.startHandshake();
                          sock = ss;
                      } else {
                          sock = raw;
                      }
                      sock.setSoTimeout(3000);
                      InputStream in = sock.getInputStream();
                      OutputStream out = sock.getOutputStream();

                      String token = prefs.getString("tvtoken_" + ip, "");
                      String name = Base64.encodeToString("TVMirror".getBytes("UTF-8"), Base64.NO_WRAP);
                      String path = "/api/v2/channels/samsung.remote.control?name=" + name
                              + (token.length() > 0 ? "&token=" + token : "");
                      byte[] kb = new byte[16];
                      RND.nextBytes(kb);
                      String key = Base64.encodeToString(kb, Base64.NO_WRAP);
                      String req = "GET " + path + " HTTP/1.1\r\nHost: " + ip + ":" + p
                              + "\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: " + key
                              + "\r\nSec-WebSocket-Version: 13\r\n\r\n";
                      out.write(req.getBytes("ISO-8859-1"));
                      out.flush();

                      String resp = readHeaders(in);
                      if (resp == null || !resp.contains(" 101")) return null;

                      long deadline = System.currentTimeMillis() + 30000;
                      long closeAfter = 0;
                      boolean sent = false;
                      Pattern tokenPat = Pattern.compile("\"token\"\\s*:\\s*\"([^\"]+)\"");
                      while (System.currentTimeMillis() < deadline) {
                          if (sent && System.currentTimeMillis() > closeAfter) break;
                          String m;
                          try {
                              sock.setSoTimeout(1000);
                              m = readFrame(sock, in);
                          } catch (SocketTimeoutException e) {
                              continue;
                          }
                          if (m == null) break;
                          if (m.length() == 0) continue;
                          if (m.contains("ms.channel.connect")) {
                              Matcher mt = tokenPat.matcher(m);
                              if (mt.find()) prefs.edit().putString("tvtoken_" + ip, mt.group(1)).apply();
                              if (!sent) {
                                  String json = "{\"method\":\"ms.channel.emit\",\"params\":{\"event\":\"ed.apps.launch\","
                                          + "\"to\":\"host\",\"data\":{\"appId\":\"org.tizen.browser\","
                                          + "\"action_type\":\"NATIVE_LAUNCH\",\"metaTag\":\"" + url + "\"}}}";
                                  sendText(out, json);
                                  sent = true;
                                  closeAfter = System.currentTimeMillis() + 2500;
                              }
                          } else if (m.contains("ms.channel.timeout") || m.contains("ms.channel.unauthorized")) {
                              return "A TV não autorizou. Aceite o aviso na tela da TV (com o controle) e tente de novo.";
                          }
                      }
                      if (sent) {
                          return "Comando enviado! A TV deve abrir o navegador. Se abrir sem o endereço, digite: " + url;
                      }
                      return "A TV não respondeu. Veja se apareceu um aviso na tela dela, aceite com o controle e tente de novo.";
                  } catch (Exception e) {
                      return null;
                  } finally {
                      try { if (sock != null) sock.close(); } catch (Exception e) { }
                      try { if (raw != null) raw.close(); } catch (Exception e) { }
                  }
              }

              private static String readHeaders(InputStream in) throws Exception {
                  StringBuilder sb = new StringBuilder();
                  int state = 0;
                  while (sb.length() < 8192) {
                      int b = in.read();
                      if (b < 0) return null;
                      sb.append((char) b);
                      if (b == '\r' && (state == 0 || state == 2)) state++;
                      else if (b == '\n' && (state == 1 || state == 3)) state++;
                      else state = 0;
                      if (state == 4) return sb.toString();
                  }
                  return null;
              }

              // null = conexao fechada; "" = quadro que nao e texto; senao o texto.
              private static String readFrame(Socket sock, InputStream in) throws Exception {
                  int b0 = in.read();
                  if (b0 < 0) return null;
                  sock.setSoTimeout(5000);
                  int opcode = b0 & 0x0F;
                  int b1 = in.read();
                  if (b1 < 0) return null;
                  boolean masked = (b1 & 0x80) != 0;
                  long len = b1 & 0x7F;
                  if (len == 126) {
                      len = (in.read() << 8) | in.read();
                  } else if (len == 127) {
                      len = 0;
                      for (int i = 0; i < 8; i++) len = (len << 8) | in.read();
                  }
                  if (len > 1000000) return null;
                  byte[] mask = new byte[4];
                  if (masked) readFully(in, mask);
                  byte[] payload = new byte[(int) len];
                  readFully(in, payload);
                  if (masked) {
                      for (int i = 0; i < payload.length; i++) payload[i] = (byte) (payload[i] ^ mask[i % 4]);
                  }
                  if (opcode == 8) return null;
                  if (opcode == 1) return new String(payload, "UTF-8");
                  return "";
              }

              private static void readFully(InputStream in, byte[] buf) throws Exception {
                  int off = 0;
                  while (off < buf.length) {
                      int n = in.read(buf, off, buf.length - off);
                      if (n < 0) throw new java.io.IOException("fim");
                      off += n;
                  }
              }

              private static void sendText(OutputStream out, String text) throws Exception {
                  byte[] p = text.getBytes("UTF-8");
                  byte[] mask = new byte[4];
                  RND.nextBytes(mask);
                  ByteArrayOutputStream b = new ByteArrayOutputStream();
                  b.write(0x81);
                  if (p.length < 126) {
                      b.write(0x80 | p.length);
                  } else {
                      b.write(0x80 | 126);
                      b.write((p.length >> 8) & 0xFF);
                      b.write(p.length & 0xFF);
                  }
                  b.write(mask, 0, 4);
                  for (int i = 0; i < p.length; i++) b.write(p[i] ^ mask[i % 4]);
                  out.write(b.toByteArray());
                  out.flush();
              }
          }

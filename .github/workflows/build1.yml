                  LinearLayout statusRow = new LinearLayout(this);
                  statusRow.setOrientation(LinearLayout.HORIZONTAL);
                  statusRow.setGravity(Gravity.CENTER_VERTICAL);
                  dot = new View(this);
                  statusRow.addView(dot, new LinearLayout.LayoutParams(dp(12), dp(12)));
                  statusText = text("", 18, TEXT, true);
                  LinearLayout.LayoutParams stp = new LinearLayout.LayoutParams(WRAP, WRAP);
                  stp.leftMargin = dp(10);
                  statusRow.addView(statusText, stp);
                  card.addView(statusRow);

                  urlText = text("", 20, LINK, true);
                  urlText.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);
                  urlText.setTextIsSelectable(true);
                  card.addView(urlText, lp(MATCH, WRAP, 14));

                  hintText = text("", 15, MUTED, false);
                  card.addView(hintText, lp(MATCH, WRAP, 10));

                  tvBtn = text("Abrir na TV automaticamente", 15, TEXT, true);
                  tvBtn.setGravity(Gravity.CENTER);
                  tvBtn.setPadding(dp(8), dp(13), dp(8), dp(13));
                  tvBtn.setBackground(rounded(CHIP, 12));
                  tvBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { sendToTv(); }
                  });
                  card.addView(tvBtn, lp(MATCH, WRAP, 14));

                  tvStatus = text("", 13, AMBER, false);
                  card.addView(tvStatus, lp(MATCH, WRAP, 8));
                  root.addView(card, lp(MATCH, WRAP, 22));

                  // botao principal
                  mainBtn = text("", 18, TEXT, true);
                  mainBtn.setGravity(Gravity.CENTER);
                  mainBtn.setPadding(dp(8), dp(18), dp(8), dp(18));
                  mainBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { toggle(); }
                  });
                  root.addView(mainBtn, lp(MATCH, WRAP, 20));

                  lockNote = text("Mudanças valem na hora, sem parar o espelhamento.", 13, MUTED, false);
                  root.addView(lockNote, lp(MATCH, WRAP, 10));

                  // perfis
                  root.addView(text("Perfil", 13, MUTED, true), lp(MATCH, WRAP, 22));
                  LinearLayout prow = new LinearLayout(this);
                  prow.setOrientation(LinearLayout.HORIZONTAL);
                  for (int i = 0; i < 3; i++) {
                      final int idx = i;
                      TextView c = text(PRESET_N[i], 15, MUTED, true);
                      c.setGravity(Gravity.CENTER);
                      c.setPadding(dp(6), dp(13), dp(6), dp(13));
                      c.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) {
                              SharedPreferences.Editor ed = prefs.edit();
                              for (int k = 0; k < 3; k++) {
                                  sel[k] = PRESET_V[idx][k];
                                  ed.putInt(KEYS[k], sel[k]);
                              }
                              ed.apply();
                              refresh();
                              pushLive();
                          }
                      });
                      LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(0, WRAP, 1f);
                      if (i > 0) cp.leftMargin = dp(8);
                      prow.addView(c, cp);
                      presetChips[i] = c;
                  }
                  root.addView(prow, lp(MATCH, WRAP, 6));

                  addChoice(root, "Resolução", 0, RES_N);
                  addChoice(root, "FPS (quadros por segundo)", 1, FPS_N);
                  addChoice(root, "Qualidade da imagem", 2, QUAL_N);
                  addChoice(root, "Áudio", 3, AUD_N);
                  addChoice(root, "Taxa do áudio", 4, RATE_N);
                  addChoice(root, "Canais do áudio", 5, CH_N);

                  audioText = text("", 13, MUTED, false);
                  root.addView(audioText, lp(MATCH, WRAP, 22));

                  sv.addView(root);
                  setContentView(sv);

                  List<String> perms = new ArrayList<String>();
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      perms.add("android.permission.POST_NOTIFICATIONS");
                  }
                  if (Build.VERSION.SDK_INT >= 29
                          && checkSelfPermission("android.permission.RECORD_AUDIO") != PackageManager.PERMISSION_GRANTED) {
                      perms.add("android.permission.RECORD_AUDIO");
                  }
                  if (!perms.isEmpty()) requestPermissions(perms.toArray(new String[0]), 1);

                  refresh();
              }

              private void addChoice(LinearLayout root, String label, final int key, String[] names) {
                  root.addView(text(label, 13, MUTED, true), lp(MATCH, WRAP, 18));
                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  chips[key] = new TextView[names.length];
                  for (int i = 0; i < names.length; i++) {
                      final int idx = i;
                      TextView c = text(names[i], 14, MUTED, true);
                      c.setGravity(Gravity.CENTER);
                      c.setPadding(dp(14), dp(11), dp(14), dp(11));
                      c.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) {
                              sel[key] = idx;
                              prefs.edit().putInt(KEYS[key], idx).apply();
                              refresh();
                              pushLive();
                          }
                      });
                      LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(WRAP, WRAP);
                      if (i > 0) cp.leftMargin = dp(8);
                      row.addView(c, cp);
                      chips[key][i] = c;
                  }
                  hs.addView(row);
                  root.addView(hs, lp(MATCH, WRAP, 6));
              }

              @Override protected void onResume() {
                  super.onResume();
                  ui.post(ticker);
              }

              @Override protected void onPause() {
                  super.onPause();
                  ui.removeCallbacks(ticker);
              }

              private void toggle() {
                  if (MirrorService.running) {
                      stopService(new Intent(this, MirrorService.class));
                      ui.postDelayed(new Runnable() {
                          @Override public void run() { refresh(); }
                      }, 500);
                  } else {
                      MediaProjectionManager m = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      startActivityForResult(m.createScreenCaptureIntent(), REQ_CAPTURE);
                  }
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_CAPTURE && resultCode == RESULT_OK && data != null) {
                      Intent i = new Intent(this, MirrorService.class);
                      i.putExtra("code", resultCode);
                      i.putExtra("data", data);
                      putSettings(i);
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(i);
                      else startService(i);
                      ui.postDelayed(new Runnable() {
                          @Override public void run() { refresh(); }
                      }, 800);
                  }
              }

              private void putSettings(Intent i) {
                  i.putExtra("edge", RES_V[sel[0]]);
                  i.putExtra("fps", FPS_V[sel[1]]);
                  i.putExtra("quality", QUAL_V[sel[2]]);
                  i.putExtra("audio", sel[3] == 0);
                  i.putExtra("rate", RATE_V[sel[4]]);
                  i.putExtra("ch", sel[5] == 1 ? 1 : 2);
              }

              // Envia as configuracoes novas ao servico em execucao (sem parar o espelhamento).
              private void pushLive() {
                  if (!MirrorService.running) return;
                  Intent i = new Intent(this, MirrorService.class);
                  i.setAction(MirrorService.ACTION_UPDATE);
                  putSettings(i);
                  startService(i);
              }

              private void sendToTv() {
                  if (!MirrorService.running) return;
                  tvStatus.setVisibility(View.VISIBLE);
                  tvStatus.setText("Procurando a TV na rede… (na primeira vez, aceite o aviso na TV)");
                  final List<String> ips = localIps();
                  new Thread(new Runnable() {
                      @Override public void run() {
                          final String r = TvLauncher.openUrl(ips, MirrorService.PORT, prefs);
                          runOnUiThread(new Runnable() {
                              @Override public void run() { tvStatus.setText(r); }
                          });
                      }
                  }).start();
              }

              private void refresh() {
                  boolean on = MirrorService.running;

                  int color;
                  String status;
                  if (!on) { color = GRAY; status = "Parado"; }
                  else if (MirrorServer.viewerActive()) { color = GREEN; status = "TV conectada"; }
                  else { color = AMBER; status = "Aguardando a TV…"; }
                  dot.setBackground(rounded(color, 6));
                  statusText.setText(status);

                  if (on) {
                      StringBuilder sb = new StringBuilder();
                      for (String ip : localIps()) {
                          if (sb.length() > 0) sb.append("\n");
                          sb.append("http://").append(ip).append(":").append(MirrorService.PORT);
                      }
                      if (sb.length() == 0) sb.append("Ligue o hotspot");
                      urlText.setVisibility(View.VISIBLE);
                      urlText.setText(sb.toString());
                      hintText.setText("Abra este endereço no navegador (Internet) da TV e salve nos favoritos para não digitar de novo. Na TV, aperte 1 no controle para ver fps e tempo de decodificação.");
                      tvBtn.setVisibility(View.VISIBLE);
                  } else {
                      urlText.setVisibility(View.GONE);
                      hintText.setText("1. Ligue o hotspot do celular\n2. Conecte a TV nele\n3. Toque em Iniciar\n4. Abra o endereço mostrado no navegador da TV\n\nDica: hotspot em 5 GHz reduz o atraso.");
                      tvBtn.setVisibility(View.GONE);
                      tvStatus.setVisibility(View.GONE);
                      tvStatus.setText("");
                  }

                  lockNote.setVisibility(on ? View.VISIBLE : View.GONE);

                  for (int i = 0; i < 3; i++) {
                      boolean match = sel[0] == PRESET_V[i][0] && sel[1] == PRESET_V[i][1] && sel[2] == PRESET_V[i][2];
                      presetChips[i].setBackground(rounded(match ? ACCENT : CHIP, 12));
                      presetChips[i].setTextColor(match ? TEXT : MUTED);
                  }
                  for (int k = 0; k < 6; k++) {
                      for (int i = 0; i < chips[k].length; i++) {
                          boolean s = (i == sel[k]);
                          chips[k][i].setBackground(rounded(s ? ACCENT : CHIP, 12));
                          chips[k][i].setTextColor(s ? TEXT : MUTED);
                      }
                  }

                  mainBtn.setText(on ? "Parar espelhamento" : "Iniciar espelhamento");
                  mainBtn.setBackground(rounded(on ? DANGER : ACCENT, 14));

                  String a;
                  if (Build.VERSION.SDK_INT < 29) {
                      a = "Som: indisponível neste Android (precisa do 10 ou superior). O vídeo funciona normalmente.";
                  } else if (on) {
                      a = MirrorService.audioActive
                              ? "Som: ativo. Se a TV não tocar sozinha, aperte qualquer tecla no controle uma vez. Setas esquerda/direita ajustam o atraso do som."
                              : "Som: desligado ou sem permissão (permita o microfone nas permissões do app).";
                  } else {
                      a = "Som: disponível neste celular (Android 10+).";
                  }
                  audioText.setText(a);
              }

              private static List<String> localIps() {
                  List<String> r = new ArrayList<String>();
                  try {
                      for (NetworkInterface ni : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          if (!ni.isUp() || ni.isLoopback()) continue;
                          String n = ni.getName();
                          if (n.startsWith("rmnet") || n.startsWith("ccmni") || n.startsWith("dummy")
                                  || n.startsWith("tun") || n.startsWith("v4-")) continue;
                          for (InetAddress a : Collections.list(ni.getInetAddresses())) {
                              if (a instanceof Inet4Address && !a.isLoopbackAddress()) {
                                  r.add(a.getHostAddress());
                              }
                          }
                      }
                  } catch (Exception e) { }
                  return r;
              }
          }
          EOF

          find . -type f | sort

      - name: Compilar APK
        working-directory: tvmirror
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp tvmirror/app/build/outputs/apk/debug/app-debug.apk TVMirror.apk

      - name: Guardar APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TVMirror-apk
          path: TVMirror.apk
          if-no-files-found: error

      - name: Publicar APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: TV Mirror APK #${{ github.run_number }}
          files: TVMirror.apk
          fail_on_unmatched_files: true

      - name: Salvar APK no repositorio (pasta apk)
        run: |
          mkdir -p apk
          cp TVMirror.apk apk/TVMirror.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk/TVMirror.apk
          git commit -m "APK #${{ github.run_number }}" || echo "sem mudancas"
          git push

      - name: Resumo com link do APK
        run: |
          echo "### APK pronto" >> "$GITHUB_STEP_SUMMARY"
          echo "Baixe aqui: https://github.com/${{ github.repository }}/releases/tag/apk-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ou direto do repositorio: https://github.com/${{ github.repository }}/raw/HEAD/apk/TVMirror.apk" >> "$GITHUB_STEP_SUMMARY"

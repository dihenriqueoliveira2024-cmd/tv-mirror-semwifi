              private void onFrameAvailable(ImageReader rd) {
                  if (rd != reader) return;
                  long wait = minIntervalMs - (SystemClock.uptimeMillis() - lastFrameMs);
                  if (wait > 0) {
                      if (!framePending) {
                          framePending = true;
                          handler.postDelayed(pendingTask, wait);
                      }
                      return;
                  }
                  processFrame(rd);

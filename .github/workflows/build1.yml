                  running = false;
                  audioActive = false;
                  try { if (handler != null) handler.removeCallbacks(pendingTask); } catch (Exception e) { }
                  synchronized (audioLock) {
                      try { if (audio != null) audio.stop(); } catch (Exception e) { }

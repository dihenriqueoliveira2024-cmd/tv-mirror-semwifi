                  float scale = longEdge > maxEdge ? (float) maxEdge / longEdge : 1f;
                  int w = Math.max(2, ((int) (m.widthPixels * scale)) & ~1);
                  int h = Math.max(2, ((int) (m.heightPixels * scale)) & ~1);
                  return new int[] { w, h, m.densityDpi };
